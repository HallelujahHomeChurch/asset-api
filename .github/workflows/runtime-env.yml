name: Runtime environment

on:
  push:
    branches: [main]
    paths: [infra/runtime-env.json]

permissions:
  contents: read

jobs:
  route:
    if: ${{ github.repository == 'HallelujahHomeChurch/asset-api' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      config_only: ${{ steps.scope.outputs.config_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Route config-only changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/ci-runtime-env.py deploy push "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  configure:
    needs: route
    if: needs.route.outputs.config_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: asset-api-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply runtime environment using the serving template
        env:
          RUNTIME_ENV_BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          az extension add --name containerapp --yes --only-show-errors
          python3 scripts/runtime_env.py deploy
