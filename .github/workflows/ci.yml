name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      cancellation_fixture:
        description: Run isolated cancellation recovery proof (no production access)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: asset-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent_docs:
    if: ${{ !inputs.cancellation_fixture }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test documentation classification
        run: python3 .github/scripts/test-ci-agent-docs.py
      - name: Classify proven human documentation
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci-agent-docs.py "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: agent_docs
    if: ${{ !cancelled() && !inputs.cancellation_fixture && (needs.agent_docs.result != 'success' || needs.agent_docs.outputs.docs_only != 'true') }}
    outputs:
      image_artifact_id: ${{ steps.images_artifact.outputs.artifact-id }}
      api_image_id: ${{ steps.image_fixture.outputs.api_image_id }}
      scan_image_id: ${{ steps.image_fixture.outputs.scan_image_id }}
      recording_image_id: ${{ steps.image_fixture.outputs.recording_image_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: asset_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asset_test?sslmode=disable
      TEST_MEDIA_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asset_media_test?sslmode=disable
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      ASSET_ALLOW_DESTRUCTIVE_TEST: "1"
      HHC_REQUIRE_MEDIA_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          echo "TRIVY_CACHE=$trivy_cache" >> "$GITHUB_ENV"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@2.47.0 lint docs/openapi.yaml
      - name: Verify member media Worker
        working-directory: workers/member-media
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Scan complete Git history
        run: ./scripts/test-gitleaks.sh
      - name: Install media validation test tools
        timeout-minutes: 15
        run: ./scripts/install-media-test-tools.sh
      - name: Create isolated media test database
        run: docker exec "${{ job.services.postgres.id }}" createdb --username=postgres asset_media_test
      - name: Fingerprint synthetic broadcast inputs
        id: broadcast_fixture
        run: |
          python3 scripts/test-broadcast-fixture-cache.py
          echo "HHC_BROADCAST_FIXTURE_DIR=$RUNNER_TEMP/broadcast-fixture" >> "$GITHUB_ENV"
          fingerprint="$(python3 scripts/broadcast-fixture-cache.py key)"
          echo "key=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore synthetic broadcast raw media
        id: broadcast_restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.HHC_BROADCAST_FIXTURE_DIR }}/raw
          key: broadcast-raw-${{ steps.broadcast_fixture.outputs.key }}
      - name: Validate restored raw media before reuse
        env:
          FIXTURE_KEY: ${{ steps.broadcast_fixture.outputs.key }}
        run: |
          if ! python3 scripts/broadcast-fixture-cache.py validate "$HHC_BROADCAST_FIXTURE_DIR/raw" "$FIXTURE_KEY"; then
            rm -rf -- "$HHC_BROADCAST_FIXTURE_DIR/raw"
          fi
      - run: |
          ./scripts/bootstrap-migration-role.test.sh
          ./scripts/test-line-media-acl-inventory.sh
          ./scripts/test-migration-policy-test.sh
          ./scripts/test-migration-policy.sh internal/migrations/sql/*.sql
          ./scripts/test-what-if-policy.sh
          ./scripts/test-install-media-test-tools.sh
          bash scripts/ensure-workload-app-role.test.sh
          mkdir -p .artifacts/data-governance
          set -o pipefail
          python3 scripts/test-go-lanes_test.py
          python3 scripts/test-go-lanes.py
          python3 scripts/meeting-cron-drift.test.py
          GOVERNANCE_TEST_EVENTS="$PWD/.artifacts/data-governance/test-events.jsonl" \
          GOVERNANCE_OUTPUT_DIR="$PWD/.artifacts/data-governance/export" \
            go test ./internal/governance -run '^TestDataGovernanceExport$' -count=1
          bash scripts/test-publish-data-governance.sh
          go vet ./...
          ./scripts/test-release-workflow.sh
          az bicep build --file infra/recording-source.bicep --stdout >/dev/null
          az bicep build --file infra/main.bicep --stdout >/dev/null
          docker build -t asset-api:verify .
          ./scripts/test-image-binaries.sh asset-api:verify
          docker build -f Dockerfile.scan -t asset-scan:verify .
          docker build -f Dockerfile.recording -t asset-recording:verify .
          docker run --rm --entrypoint ffprobe asset-recording:verify -version >/dev/null
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TRIVY_CACHE:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 asset-api:verify
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TRIVY_CACHE:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 asset-scan:verify
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TRIVY_CACHE:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 asset-recording:verify
      - name: Store verified governance manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-governance-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          path: |
            .artifacts/data-governance/export/data-governance.yaml
            .artifacts/data-governance/export/data-governance.json
      - name: Seal verified synthetic broadcast raw media
        env:
          FIXTURE_KEY: ${{ steps.broadcast_fixture.outputs.key }}
        run: python3 scripts/broadcast-fixture-cache.py seal "$HHC_BROADCAST_FIXTURE_DIR/raw" "$FIXTURE_KEY"
      - name: Cache verified synthetic broadcast raw media
        if: steps.broadcast_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.HHC_BROADCAST_FIXTURE_DIR }}/raw
          key: broadcast-raw-${{ steps.broadcast_fixture.outputs.key }}
      - name: Test release image handoff with tiny Docker fixtures
        id: image_fixture
        run: bash scripts/test-release-image-artifact.sh "$RUNNER_TEMP/release-images"
      - name: Store image transport fixture
        id: images_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-fixture-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-images
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image-transport:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require immutable image artifact ID
        env:
          IMAGE_ARTIFACT_ID: ${{ needs.verify.outputs.image_artifact_id }}
        run: '[[ "$IMAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Download verified release images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.image_artifact_id }}
          path: ${{ runner.temp }}/release-images
          digest-mismatch: error
      - name: Verify and load release images
        id: images
        run: bash scripts/release-image-artifact.sh load "$RUNNER_TEMP/release-images" "$GITHUB_SHA"
      - name: Verify transported producer identities
        env:
          EXPECTED_API: ${{ needs.verify.outputs.api_image_id }}
          EXPECTED_SCAN: ${{ needs.verify.outputs.scan_image_id }}
          EXPECTED_RECORDING: ${{ needs.verify.outputs.recording_image_id }}
          ACTUAL_API: ${{ steps.images.outputs.api_image_id }}
          ACTUAL_SCAN: ${{ steps.images.outputs.scan_image_id }}
          ACTUAL_RECORDING: ${{ steps.images.outputs.recording_image_id }}
        run: |
          [[ "$EXPECTED_API" =~ ^sha256:[0-9a-f]{64}$ && "$ACTUAL_API" == "$EXPECTED_API" ]]
          [[ "$EXPECTED_SCAN" =~ ^sha256:[0-9a-f]{64}$ && "$ACTUAL_SCAN" == "$EXPECTED_SCAN" ]]
          [[ "$EXPECTED_RECORDING" =~ ^sha256:[0-9a-f]{64}$ && "$ACTUAL_RECORDING" == "$EXPECTED_RECORDING" ]]

  cancellation_fixture:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cancellation_fixture }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RESOURCE_GROUP: alive
      AZURE_SUBSCRIPTION_ID: 00000000-0000-0000-0000-000000000001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture synthetic previous state
        id: capture_workers
        run: |
          mkdir .fixture-bin
          echo previous > .fixture-previous
          echo Running > .fixture-arm-state
          echo PREVIOUS_READY_REVISION=fixture-ready >> "$GITHUB_ENV"
          cat > .fixture-bin/az <<'PYTHON'
          #!/usr/bin/env python3
          import json, pathlib, sys
          args = sys.argv[1:]
          path = pathlib.Path('.fixture-arm-state')
          if args[:3] == ['deployment', 'group', 'show']:
              print(json.dumps(path.read_text().strip()))
          elif args[:3] == ['deployment', 'group', 'cancel']:
              path.write_text('Canceled')
              print('{}')
          elif args[:2] == ['resource', 'show']:
              print('"Succeeded"')
          else:
              raise SystemExit('unexpected mock Azure operation')
          PYTHON
          chmod +x .fixture-bin/az
      - name: Synthetic in-flight deployment
        id: deploy_runtime
        run: |
          echo new > .fixture-current
          echo CANCELLATION_FIXTURE_WAITING
          sleep 600
      - name: Settle interrupted runtime deployment
        id: settle_runtime
        if: ${{ (failure() || cancelled()) && (steps.deploy_runtime.outcome == 'success' || steps.deploy_runtime.outcome == 'failure' || steps.deploy_runtime.outcome == 'cancelled') }}
        run: |
          export PATH="$PWD/.fixture-bin:$PATH"
          python3 scripts/worker-release-rollback.py settle "asset-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Roll back failed runtime
        if: ${{ (failure() || cancelled()) && env.PREVIOUS_READY_REVISION != '' && ((steps.deploy_runtime.outcome == 'success' || steps.deploy_runtime.outcome == 'failure' || steps.deploy_runtime.outcome == 'cancelled') || steps.quiesce_recording.outputs.paused == 'true') && (steps.settle_runtime.outcome == 'success' || steps.deploy_runtime.outcome == 'skipped') }}
        run: |
          cp .fixture-previous .fixture-current
          test "$(cat .fixture-current)" = previous
          echo CANCELLATION_FIXTURE_RECOVERED
