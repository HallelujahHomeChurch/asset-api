name: Production Release

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/data-governance.yaml'
      - '!.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-asset-api-production
        required: true
        type: string
      fail_openapi_before_pointer:
        description: Test last-good API docs pointer preservation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: asset-api-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: asset_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asset_test?sslmode=disable
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      ASSET_ALLOW_DESTRUCTIVE_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace
      - run: |
          ./scripts/bootstrap-migration-role.test.sh
          ./scripts/test-migration-policy-test.sh
          ./scripts/test-migration-policy.sh internal/migrations/sql/*.sql
          ./scripts/test-what-if-policy.sh
          mkdir -p .artifacts/data-governance
          set -o pipefail
          go test -race -json ./... -count=1 -p=1 | tee .artifacts/data-governance/test-events.jsonl
          GOVERNANCE_TEST_EVENTS="$PWD/.artifacts/data-governance/test-events.jsonl" \
          GOVERNANCE_OUTPUT_DIR="$PWD/.artifacts/data-governance/export" \
            go test ./internal/governance -run '^TestDataGovernanceExport$' -count=1
          bash scripts/test-publish-data-governance.sh
          go vet ./...
          ./scripts/test-release-workflow.sh
          docker build -t asset-api:verify .
          docker export "$(docker create asset-api:verify)" | tar -tf - | grep -Fx 'asset-derivative-worker' >/dev/null
          docker export "$(docker create asset-api:verify)" | tar -tf - | grep -Fx 'asset-scan-warmer' >/dev/null
          docker build -f Dockerfile.scan -t asset-scan:verify .
          clam_help="$(docker run --rm --entrypoint clamscan asset-scan:verify --help)"
          for flag in --max-filesize --max-scansize --max-files --max-recursion --alert-exceeds-max --alert-encrypted; do
            grep -Fq -- "$flag" <<<"$clam_help"
          done
      - name: Store verified governance manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-governance-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          path: |
            .artifacts/data-governance/export/data-governance.yaml
            .artifacts/data-governance/export/data-governance.json

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    outputs:
      commit: ${{ steps.release_outputs.outputs.commit }}
      image: ${{ steps.release_outputs.outputs.image }}
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: alive
      ACR_LOGIN_SERVER: alive.azurecr.io
      IMAGE_REPOSITORY: alive/asset-api
      SCAN_IMAGE_REPOSITORY: alive/asset-scan
      RESOURCE_GROUP: alive
      STORAGE_ACCOUNT_NAME: alivestoragebb99ee6e
      MIGRATION_JOB_NAME: asset-migrate
      SCAN_WORKER_APP_NAME: asset-scan-worker
      DERIVATIVE_JOB_NAME: asset-derivative
      API_APP_NAME: asset-api
      API_GATEWAY_APP_NAME: api-gateway
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ASSET_WORKLOAD_CLIENT_ID: ${{ vars.ASSET_WORKLOAD_CLIENT_ID }}
      ASSET_WORKLOAD_AUDIENCE: ${{ vars.ASSET_WORKLOAD_AUDIENCE }}
      ASSET_READER_CALLER_APP_ID: api-gateway
      LINE_ATTACHMENT_CLIENT_ID: ${{ vars.LINE_ATTACHMENT_CLIENT_ID }}
      LINE_ATTACHMENT_OBJECT_ID: ${{ vars.LINE_ATTACHMENT_OBJECT_ID }}
      MEETING_API_BASE_URL: ${{ vars.MEETING_API_BASE_URL }}
      MEETING_API_AUDIENCE: ${{ vars.MEETING_API_AUDIENCE }}
      RELEASE_CONFIRMATION: ${{ github.event_name == 'push' && 'deploy-asset-api-production' || inputs.confirmation }}
      ACTIVATE_QUEUE_SCANNING: "true"
      EMBEDDED_SCAN_ENABLED: "false"
      DEPLOY_RETENTION_JOB: "true"
      RETENTION_SCHEDULE_ENABLED: "false"
      RETENTION_APPLY_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release configuration
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_CONFIRMATION" == "deploy-asset-api-production" ]]
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ASSET_WORKLOAD_CLIENT_ID ASSET_WORKLOAD_AUDIENCE LINE_ATTACHMENT_CLIENT_ID LINE_ATTACHMENT_OBJECT_ID MEETING_API_BASE_URL MEETING_API_AUDIENCE; do
            test -n "${!name:-}" || { echo "Missing repository variable: ${name}" >&2; exit 1; }
          done
          for name in RETENTION_SCHEDULE_ENABLED RETENTION_APPLY_ENABLED; do
            case "${!name}" in
              true|false) ;;
              *) echo "${name} must be true or false" >&2; exit 1 ;;
            esac
          done
      - name: Set image tag
        run: echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --yes
      - name: Verify isolated runtime prerequisites
        run: |
          runtime_principal="$(az identity show -g "$RESOURCE_GROUP" -n asset-api-runtime-identity --query principalId -o tsv --only-show-errors)"
          migration_principal="$(az identity show -g "$RESOURCE_GROUP" -n asset-migrate-identity --query principalId -o tsv --only-show-errors)"
          runtime_vault="$(az keyvault show -g "$RESOURCE_GROUP" -n alive-asset-runtime-kv --query id -o tsv --only-show-errors)"
          migration_vault="$(az keyvault show -g "$RESOURCE_GROUP" -n alive-asset-migrate-kv --query id -o tsv --only-show-errors)"
          app_principal="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query identity.principalId -o tsv --only-show-errors)"
          scan_principal="$(az identity show -g "$RESOURCE_GROUP" -n asset-scan-identity --query principalId -o tsv --only-show-errors)"
          derivative_principal="$(az identity show -g "$RESOURCE_GROUP" -n asset-derivative-identity --query principalId -o tsv --only-show-errors)"
          refresh_principal="$(az identity show -g "$RESOURCE_GROUP" -n asset-signature-refresh-identity --query principalId -o tsv --only-show-errors)"
          storage_id="$(az storage account show -g "$RESOURCE_GROUP" -n "$STORAGE_ACCOUNT_NAME" --query id -o tsv --only-show-errors)"
          scan_queue_scope="${storage_id}/queueServices/default/queues/asset-scan"
          poison_queue_scope="${storage_id}/queueServices/default/queues/asset-scan-poison"
          derivative_queue_scope="${storage_id}/queueServices/default/queues/asset-derivative"
          derivative_poison_queue_scope="${storage_id}/queueServices/default/queues/asset-derivative-poison"
          blob_scope="${storage_id}/blobServices/default/containers/assets"
          signature_scope="${storage_id}/blobServices/default/containers/asset-signatures"
          [[ "$(az role assignment list --scope "$runtime_vault" --assignee-object-id "$runtime_principal" --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$migration_vault" --assignee-object-id "$migration_principal" --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          az resource show --ids "$scan_queue_scope" --api-version 2023-05-01 --only-show-errors --output none
          [[ "$(az role assignment list --scope "$scan_queue_scope" --assignee-object-id "$app_principal" --query "[?roleDefinitionName=='Storage Queue Data Message Sender'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$scan_queue_scope" --assignee-object-id "$scan_principal" --query "[?roleDefinitionName=='Storage Queue Data Message Processor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$scan_queue_scope" --assignee-object-id "$scan_principal" --query "[?roleDefinitionName=='Storage Queue Data Reader'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$poison_queue_scope" --assignee-object-id "$scan_principal" --query "[?roleDefinitionName=='Storage Queue Data Contributor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$blob_scope" --assignee-object-id "$scan_principal" --query "[?roleDefinitionName=='Storage Blob Data Reader'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$signature_scope" --assignee-object-id "$scan_principal" --query "[?roleDefinitionName=='Storage Blob Data Reader'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$signature_scope" --assignee-object-id "$refresh_principal" --query "[?roleDefinitionName=='Storage Blob Data Contributor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          az resource show --ids "$derivative_queue_scope" --api-version 2023-05-01 --only-show-errors --output none
          az resource show --ids "$derivative_poison_queue_scope" --api-version 2023-05-01 --only-show-errors --output none
          [[ "$(az role assignment list --scope "$derivative_queue_scope" --assignee-object-id "$app_principal" --query "[?roleDefinitionName=='Storage Queue Data Message Sender'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$derivative_queue_scope" --assignee-object-id "$derivative_principal" --query "[?roleDefinitionName=='Storage Queue Data Message Processor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$derivative_queue_scope" --assignee-object-id "$derivative_principal" --query "[?roleDefinitionName=='Storage Queue Data Reader'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$derivative_poison_queue_scope" --assignee-object-id "$derivative_principal" --query "[?roleDefinitionName=='Storage Queue Data Contributor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$blob_scope" --assignee-object-id "$derivative_principal" --query "[?roleDefinitionName=='Storage Blob Data Contributor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$runtime_vault" --assignee-object-id "$derivative_principal" --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az resource show --ids "$runtime_vault/secrets/database-url" --api-version 2024-11-01 --query properties.attributes.enabled -o tsv --only-show-errors)" == "true" ]]
          [[ "$(az resource show --ids "$migration_vault/secrets/database-url" --api-version 2024-11-01 --query properties.attributes.enabled -o tsv --only-show-errors)" == "true" ]]
      - name: Capture rollback revision
        run: |
          resolve_image_ref() {
            local image="$1"
            if [[ "$image" == *@sha256:* ]]; then printf '%s\n' "$image"; return; fi
            local image_spec="${image#${ACR_LOGIN_SERVER}/}"
            local repository="${image_spec%:*}"
            local digest
            digest="$(az acr repository show --name "$ACR_NAME" --image "$image_spec" --query digest -o tsv --only-show-errors)"
            [[ "$digest" == sha256:* ]]
            printf '%s/%s@%s\n' "$ACR_LOGIN_SERVER" "$repository" "$digest"
          }
          revision="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
          image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --revision "$revision" --query properties.template.containers[0].image -o tsv --only-show-errors)"
          {
            echo "PREVIOUS_READY_REVISION=$revision"
            echo "PREVIOUS_IMAGE_REF=$(resolve_image_ref "$image")"
          } >> "$GITHUB_ENV"
      - name: Build and push image
        run: |
          az acr build --registry "$ACR_NAME" --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" --file Dockerfile .
          az acr build --registry "$ACR_NAME" --image "${SCAN_IMAGE_REPOSITORY}:${IMAGE_TAG}" --file Dockerfile.scan .
      - name: Resolve immutable image digest
        run: |
          digest="$(az acr repository show --name "$ACR_NAME" --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" --query digest -o tsv --only-show-errors)"
          [[ "$digest" == sha256:* ]]
          echo "IMAGE_REF=${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_ENV"
          scan_digest="$(az acr repository show --name "$ACR_NAME" --image "${SCAN_IMAGE_REPOSITORY}:${IMAGE_TAG}" --query digest -o tsv --only-show-errors)"
          [[ "$scan_digest" == sha256:* ]]
          echo "SCAN_IMAGE_REF=${ACR_LOGIN_SERVER}/${SCAN_IMAGE_REPOSITORY}@${scan_digest}" >> "$GITHUB_ENV"
      - name: Scan immutable images
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          runtime_report="$RUNNER_TEMP/trivy-asset-api.json"
          scan_report="$RUNNER_TEMP/trivy-asset-scan.json"
          trap 'test ! -e "$runtime_report" || unlink "$runtime_report"; test ! -e "$scan_report" || unlink "$scan_report"' EXIT
          mkdir -p "$trivy_cache"
          az acr login --name "$ACR_NAME" --only-show-errors
          docker pull "$IMAGE_REF"
          docker pull "$SCAN_IMAGE_REF"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_REF"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$SCAN_IMAGE_REF"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$trivy_cache:/root/.cache/trivy" \
            -v "$RUNNER_TEMP:/evidence" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --format json \
            --output /evidence/trivy-asset-api.json "$IMAGE_REF"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$trivy_cache:/root/.cache/trivy" \
            -v "$RUNNER_TEMP:/evidence" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --format json \
            --output /evidence/trivy-asset-scan.json "$SCAN_IMAGE_REF"
          runtime_fixable="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | unique_by(.VulnerabilityID,.PkgName,.InstalledVersion,.FixedVersion) | length' "$runtime_report")"
          runtime_unfixed="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") == "")] | unique_by(.VulnerabilityID,.PkgName,.InstalledVersion) | length' "$runtime_report")"
          scan_fixable="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | unique_by(.VulnerabilityID,.PkgName,.InstalledVersion,.FixedVersion) | length' "$scan_report")"
          scan_unfixed="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") == "")] | unique_by(.VulnerabilityID,.PkgName,.InstalledVersion) | length' "$scan_report")"
          {
            echo '### Trivy image summary'
            echo '- Scanner: `ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969`'
            echo "- Runtime artifact: \`$IMAGE_REF\`"
            echo "- Runtime fixable High/Critical: $runtime_fixable"
            echo "- Runtime unfixed High/Critical: $runtime_unfixed"
            echo "- Scan worker artifact: \`$SCAN_IMAGE_REF\`"
            echo "- Scan worker fixable High/Critical: $scan_fixable"
            echo "- Scan worker unfixed High/Critical: $scan_unfixed"
            docker run --rm -v "$trivy_cache:/root/.cache/trivy" \
              ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              version --format json | jq -r '"- Trivy: " + .Version, "- Vulnerability DB updated: " + .VulnerabilityDB.UpdatedAt'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$runtime_fixable" -eq 0
          test "$scan_fixable" -eq 0
      - name: Reject destructive infrastructure changes
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters storageAccountName="$STORAGE_ACCOUNT_NAME" migrationImage="$IMAGE_REF" runtimeImage="$IMAGE_REF" scanWorkerImage="$SCAN_IMAGE_REF" deployRuntime=true deployMigrationJob=true deployScanJob=true deployScanWorker=true deployScanWarmer=true provisionScanWarmInfrastructure=false deploySignatureRefreshJob=true deployDerivativeJob=true deployRetentionJob="$DEPLOY_RETENTION_JOB" retentionScheduleEnabled="$RETENTION_SCHEDULE_ENABLED" retentionApplyEnabled="$RETENTION_APPLY_ENABLED" scanDispatchEnabled="$ACTIVATE_QUEUE_SCANNING" embeddedScanEnabled="$EMBEDDED_SCAN_ENABLED" workloadAuthClientId="$ASSET_WORKLOAD_CLIENT_ID" workloadAuthAudience="$ASSET_WORKLOAD_AUDIENCE" lineAttachmentClientId="$LINE_ATTACHMENT_CLIENT_ID" lineAttachmentObjectId="$LINE_ATTACHMENT_OBJECT_ID" readerCallerAppId="$ASSET_READER_CALLER_APP_ID" meetingApiBaseUrl="$MEETING_API_BASE_URL" meetingApiAudience="$MEETING_API_AUDIENCE" provisionPermissions=false manageSharedInfrastructure=false \
            --validation-level Provider --result-format FullResourcePayloads --no-pretty-print --only-show-errors \
            --output json > what-if.json
          ./scripts/check-what-if.sh what-if.json
      - name: Update migration job
        run: |
          az deployment group create \
            --name "asset-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" --template-file infra/main.bicep \
            --parameters storageAccountName="$STORAGE_ACCOUNT_NAME" migrationImage="$IMAGE_REF" runtimeImage="$IMAGE_REF" deployRuntime=false deployMigrationJob=true provisionPermissions=false manageSharedInfrastructure=false \
            --only-show-errors --output none
      - name: Run migrations
        run: |
          execution_name="$(az containerapp job start -g "$RESOURCE_GROUP" -n "$MIGRATION_JOB_NAME" --query name -o tsv --only-show-errors)"
          for attempt in {1..60}; do
            status="$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$MIGRATION_JOB_NAME" --query "[?name=='${execution_name}'].properties.status | [0]" -o tsv --only-show-errors)"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Canceled|Cancelled|Stopped)
                az containerapp job logs show -g "$RESOURCE_GROUP" -n "$MIGRATION_JOB_NAME" --execution "$execution_name" --container asset-migrate --tail 200 || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Migration timed out" >&2
          exit 1
      - name: Deploy API
        id: deploy_runtime
        run: |
          az deployment group create \
            --name "asset-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" --template-file infra/main.bicep \
            --parameters storageAccountName="$STORAGE_ACCOUNT_NAME" migrationImage="$IMAGE_REF" runtimeImage="$IMAGE_REF" scanWorkerImage="$SCAN_IMAGE_REF" deployRuntime=true deployMigrationJob=true deployScanJob=true deployScanWorker=true deployScanWarmer=true provisionScanWarmInfrastructure=false deploySignatureRefreshJob=true deployDerivativeJob=true deployRetentionJob="$DEPLOY_RETENTION_JOB" retentionScheduleEnabled="$RETENTION_SCHEDULE_ENABLED" retentionApplyEnabled="$RETENTION_APPLY_ENABLED" scanDispatchEnabled="$ACTIVATE_QUEUE_SCANNING" embeddedScanEnabled="$EMBEDDED_SCAN_ENABLED" workloadAuthClientId="$ASSET_WORKLOAD_CLIENT_ID" workloadAuthAudience="$ASSET_WORKLOAD_AUDIENCE" lineAttachmentClientId="$LINE_ATTACHMENT_CLIENT_ID" lineAttachmentObjectId="$LINE_ATTACHMENT_OBJECT_ID" readerCallerAppId="$ASSET_READER_CALLER_APP_ID" meetingApiBaseUrl="$MEETING_API_BASE_URL" meetingApiAudience="$MEETING_API_AUDIENCE" provisionPermissions=false manageSharedInfrastructure=false \
            --only-show-errors --output none
      - name: Wait for API revision
        run: |
          for attempt in {1..60}; do
            latest="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestRevisionName -o tsv --only-show-errors)"
            ready="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
            if [[ -n "$latest" && "$latest" == "$ready" ]]; then
              image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --revision "$ready" --query properties.template.containers[0].image -o tsv --only-show-errors)"
              [[ "$image" == "$IMAGE_REF" ]] && exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify Dapr readiness through API gateway
        run: |
          output="$(timeout 60s script -q -e -c "az containerapp exec -g \"$RESOURCE_GROUP\" -n \"$API_GATEWAY_APP_NAME\" --command \"/usr/bin/wget -S -O - http://localhost:3500/v1.0/invoke/asset-api/method/ready\"" /dev/null 2>&1)"
          output="${output//$'\r'/}"
          grep -Eq 'HTTP/1\.[01][[:space:]]+200' <<<"$output"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"' <<<"$output"
      - name: Verify scan worker release
        run: |
          worker_image="$(az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.containers[0].image -o tsv --only-show-errors)"
          [[ "$worker_image" == "$SCAN_IMAGE_REF" ]]
          [[ "$(az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.scale.minReplicas -o tsv --only-show-errors)" == "0" ]]
          [[ "$(az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.scale.maxReplicas -o tsv --only-show-errors)" == "5" ]]
          [[ "$(az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.scale.pollingInterval -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.scale.cooldownPeriod -o tsv --only-show-errors)" == "120" ]]
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n asset-scan --query properties.configuration.triggerType -o tsv --only-show-errors)" == "Manual" ]]
          warmer_object_id="$(az identity show -g "$RESOURCE_GROUP" -n asset-scan-warmer-identity --query principalId -o tsv --only-show-errors)"
          storage_id="$(az storage account show -g "$RESOURCE_GROUP" -n "$STORAGE_ACCOUNT_NAME" --query id -o tsv --only-show-errors)"
          warm_scope="${storage_id}/queueServices/default/queues/asset-scan-warm"
          [[ "$(az role assignment list --scope "$warm_scope" --assignee-object-id "$warmer_object_id" --query "[?roleDefinitionName=='Storage Queue Data Message Sender'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
      - name: Verify scan warmer release
        run: |
          warmer_image="$(az containerapp job show -g "$RESOURCE_GROUP" -n asset-scan-warmer --query properties.template.containers[0].image -o tsv --only-show-errors)"
          [[ "$warmer_image" == "$IMAGE_REF" ]]
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n asset-scan-warmer --query properties.configuration.triggerType -o tsv --only-show-errors)" == "Schedule" ]]
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n asset-scan-warmer --query properties.configuration.scheduleTriggerConfig.cronExpression -o tsv --only-show-errors)" == "*/1 * * * *" ]]
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n asset-scan-warmer --query "properties.template.containers[0].env[?name=='MEETING_API_BASE_URL'].value | [0]" -o tsv --only-show-errors)" == "$MEETING_API_BASE_URL" ]]
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n asset-scan-warmer --query "properties.template.containers[0].env[?name=='MEETING_API_AUDIENCE'].value | [0]" -o tsv --only-show-errors)" == "$MEETING_API_AUDIENCE" ]]
      - name: Verify derivative job release
        run: |
          derivative_image="$(az containerapp job show -g "$RESOURCE_GROUP" -n "$DERIVATIVE_JOB_NAME" --query properties.template.containers[0].image -o tsv --only-show-errors)"
          [[ "$derivative_image" == "$IMAGE_REF" ]]
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n "$DERIVATIVE_JOB_NAME" --query properties.configuration.eventTriggerConfig.scale.minExecutions -o tsv --only-show-errors)" == "0" ]]
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n "$DERIVATIVE_JOB_NAME" --query properties.configuration.eventTriggerConfig.scale.maxExecutions -o tsv --only-show-errors)" == "1" ]]
      - name: Capture healthy release
        id: release_outputs
        run: |
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Roll back failed runtime
        if: ${{ failure() && steps.deploy_runtime.outcome != 'skipped' }}
        run: |
          az containerapp revision copy -g "$RESOURCE_GROUP" -n "$API_APP_NAME" \
            --from-revision "$PREVIOUS_READY_REVISION" --image "$PREVIOUS_IMAGE_REF" \
            --revision-suffix "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --only-show-errors --output none
          for attempt in {1..60}; do
            latest="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestRevisionName -o tsv --only-show-errors)"
            ready="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
            if [[ -n "$latest" && "$latest" == "$ready" ]]; then
              image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --revision "$ready" --query properties.template.containers[0].image -o tsv --only-show-errors)"
              [[ "$image" == "$PREVIOUS_IMAGE_REF" ]] && exit 0
            fi
            sleep 10
          done
          exit 1

  publish_openapi:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      STORAGE_ACCOUNT: hhcapidocsprod
      CONTAINER: api-docs-asset-api
      API_DOCS_AZURE_CLIENT_ID: ${{ vars.API_DOCS_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RELEASE_COMMIT: ${{ needs.deploy.outputs.commit }}
      RELEASE_IMAGE: ${{ needs.deploy.outputs.image }}
      FAIL_OPENAPI_BEFORE_POINTER: ${{ inputs.fail_openapi_before_pointer && github.run_attempt == 1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified governance manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: data-governance-${{ needs.deploy.outputs.commit }}
          path: .artifacts/data-governance/export
          digest-mismatch: error
      - name: Validate publication configuration
        run: |
          [[ "$RELEASE_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$RELEASE_IMAGE" == *@sha256:* ]]
          for name in API_DOCS_AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "Missing repository variable: ${name}" >&2; exit 1; }
          done
      - name: Sign in with API docs publisher identity
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.API_DOCS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish production OpenAPI contract
        run: |
          spec_blob="specs/${GITHUB_SHA}/openapi.yaml"
          spec_sha256="$(sha256sum docs/openapi.yaml | cut -d " " -f 1)"
          is_canonical_run_id() { [[ "$1" =~ ^[1-9][0-9]*$ ]]; }
          if ! is_canonical_run_id "$GITHUB_RUN_ID"; then
            echo "Invalid GITHUB_RUN_ID: expected canonical positive decimal" >&2
            exit 1
          fi
          spec_exists="$(az storage blob exists \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$spec_blob" \
            --auth-mode login \
            --only-show-errors \
            --query exists \
            --output tsv)"
          if [[ "$spec_exists" == "true" ]]; then
            existing_spec="$(mktemp)"
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "$spec_blob" \
              --file "$existing_spec" \
              --auth-mode login \
              --no-progress \
              --only-show-errors \
              --output none
            [[ "$(sha256sum "$existing_spec" | cut -d " " -f 1)" == "$spec_sha256" ]] || {
              echo "Existing OpenAPI spec hash does not match" >&2
              exit 1
            }
          else
            az storage blob upload \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "$spec_blob" \
              --file docs/openapi.yaml \
              --auth-mode login \
              --overwrite false \
              --only-show-errors \
              --output none
          fi

          jq -n \
            --arg service asset-api \
            --arg commit "$RELEASE_COMMIT" \
            --arg image "$RELEASE_IMAGE" \
            --arg specBlob "$spec_blob" \
            --arg specSha256 "$spec_sha256" \
            --arg releaseUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, service: $service, commit: $commit, image: $image, specBlob: $specBlob, specSha256: $specSha256, releaseUrl: $releaseUrl, publishedAt: $publishedAt}' \
            > current.json

          if [[ "$FAIL_OPENAPI_BEFORE_POINTER" == "true" ]]; then
            echo "Requested failure before API docs pointer upload" >&2
            exit 1
          fi

          pointer_exists="$(az storage blob exists \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name current.json \
            --auth-mode login \
            --only-show-errors \
            --query exists \
            --output tsv)"
          if [[ "$pointer_exists" == "true" ]]; then
            current_pointer="$(mktemp)"
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name current.json \
              --file "$current_pointer" \
              --auth-mode login \
              --no-progress \
              --only-show-errors \
              --output none
            current_run_id="$(jq -er --arg release_url_prefix "https://github.com/${GITHUB_REPOSITORY}/actions/runs/" '
              .releaseUrl? as $release_url
              | if ($release_url | type) == "string" and ($release_url | startswith($release_url_prefix))
                then ($release_url | ltrimstr($release_url_prefix))
                else empty
                end
            ' "$current_pointer" 2>/dev/null)" || {
              echo "Invalid existing API docs pointer: expected canonical GitHub workflow run ID" >&2
              exit 1
            }
            if ! is_canonical_run_id "$current_run_id"; then
              echo "Invalid existing API docs pointer: expected canonical GitHub workflow run ID" >&2
              exit 1
            fi
            export LC_ALL=C
            if [[ ${#current_run_id} -gt ${#GITHUB_RUN_ID} ]] || { [[ ${#current_run_id} -eq ${#GITHUB_RUN_ID} ]] && [[ "$current_run_id" > "$GITHUB_RUN_ID" || "$current_run_id" == "$GITHUB_RUN_ID" ]]; }; then
              echo "API docs pointer already belongs to workflow run $current_run_id; skipping stale or rerun publication"
              exit 0
            fi
          fi

          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name current.json \
            --file current.json \
            --auth-mode login \
            --overwrite true \
            --only-show-errors \
            --output none
      - name: Publish verified governance manifest
        env:
          SERVICE: asset-api
          RELEASE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GOVERNANCE_DIR: ${{ github.workspace }}/.artifacts/data-governance/export
        run: bash scripts/publish-data-governance.sh
