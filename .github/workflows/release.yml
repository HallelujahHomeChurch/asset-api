name: Production Release

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/data-governance.yaml'
      - '!.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-asset-api-production
        required: true
        type: string
      fail_openapi_before_pointer:
        description: Test last-good API docs pointer preservation
        required: false
        default: false
        type: boolean
      approve_extractor_app_role:
        description: Authorize the exact reviewed Asset.Invoke assignment for existing hhc-web-api-identity
        required: false
        default: false
        type: boolean
      approve_watermark_app_role:
        description: Authorize the exact reviewed Asset.Invoke assignment for hhc-web-bulletin-worker-identity
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: asset-api-production
  cancel-in-progress: false

jobs:
  agent_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test documentation classification
        run: python3 .github/scripts/test-ci-agent-docs.py
      - name: Classify proven human documentation
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci-agent-docs.py "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: agent_docs
    if: ${{ needs.agent_docs.result == 'success' && needs.agent_docs.outputs.docs_only != 'true' }}
    outputs:
      image_artifact_id: ${{ steps.images_artifact.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: asset_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asset_test?sslmode=disable
      TEST_MEDIA_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asset_media_test?sslmode=disable
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      ASSET_ALLOW_DESTRUCTIVE_TEST: "1"
      HHC_REQUIRE_MEDIA_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
      - name: Verify member media Pages bundle
        working-directory: workers/member-media
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Store verified production media bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: member-media-${{ github.sha }}
          if-no-files-found: error
          path: workers/member-media/pages/production/dist/_worker.js
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace
      - name: Install media validation test tools
        timeout-minutes: 15
        run: ./scripts/install-media-test-tools.sh
      - name: Create isolated media test database
        run: docker exec "${{ job.services.postgres.id }}" createdb --username=postgres asset_media_test
      - name: Fingerprint synthetic broadcast inputs
        id: broadcast_fixture
        run: |
          python3 scripts/test-broadcast-fixture-cache.py
          echo "HHC_BROADCAST_FIXTURE_DIR=$RUNNER_TEMP/broadcast-fixture" >> "$GITHUB_ENV"
          fingerprint="$(python3 scripts/broadcast-fixture-cache.py key)"
          echo "key=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore synthetic broadcast raw media
        id: broadcast_restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.HHC_BROADCAST_FIXTURE_DIR }}/raw
          key: broadcast-raw-${{ steps.broadcast_fixture.outputs.key }}
      - name: Validate restored raw media before reuse
        env:
          FIXTURE_KEY: ${{ steps.broadcast_fixture.outputs.key }}
        run: |
          if ! python3 scripts/broadcast-fixture-cache.py validate "$HHC_BROADCAST_FIXTURE_DIR/raw" "$FIXTURE_KEY"; then
            rm -rf -- "$HHC_BROADCAST_FIXTURE_DIR/raw"
          fi
      - run: |
          ./scripts/bootstrap-migration-role.test.sh
          ./scripts/test-migration-policy-test.sh
          ./scripts/test-migration-policy.sh internal/migrations/sql/*.sql
          ./scripts/test-what-if-policy.sh
          bash scripts/ensure-workload-app-role.test.sh
          mkdir -p .artifacts/data-governance
          set -o pipefail
          python3 scripts/test-go-lanes_test.py
          python3 scripts/test-go-lanes.py
          GOVERNANCE_TEST_EVENTS="$PWD/.artifacts/data-governance/test-events.jsonl" \
          GOVERNANCE_OUTPUT_DIR="$PWD/.artifacts/data-governance/export" \
            go test ./internal/governance -run '^TestDataGovernanceExport$' -count=1
          bash scripts/test-publish-data-governance.sh
          go vet ./...
          ./scripts/test-release-workflow.sh
          docker build -t asset-api:verify .
          ./scripts/test-image-binaries.sh asset-api:verify
          docker build -f Dockerfile.scan -t asset-scan:verify .
          docker build -f Dockerfile.recording -t asset-recording:verify .
          docker run --rm --entrypoint ffprobe asset-recording:verify -version >/dev/null
          clam_help="$(docker run --rm --entrypoint clamscan asset-scan:verify --help)"
          for flag in --max-filesize --max-scansize --max-files --max-recursion --alert-exceeds-max --alert-encrypted; do
            grep -Fq -- "$flag" <<<"$clam_help"
          done
      - name: Store verified governance manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-governance-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          path: |
            .artifacts/data-governance/export/data-governance.yaml
            .artifacts/data-governance/export/data-governance.json
      - name: Seal verified synthetic broadcast raw media
        env:
          FIXTURE_KEY: ${{ steps.broadcast_fixture.outputs.key }}
        run: python3 scripts/broadcast-fixture-cache.py seal "$HHC_BROADCAST_FIXTURE_DIR/raw" "$FIXTURE_KEY"
      - name: Cache verified synthetic broadcast raw media
        if: steps.broadcast_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.HHC_BROADCAST_FIXTURE_DIR }}/raw
          key: broadcast-raw-${{ steps.broadcast_fixture.outputs.key }}
      - name: Seal verified release images
        run: bash scripts/release-image-artifact.sh pack "$RUNNER_TEMP/release-images" "$GITHUB_SHA" asset-api:verify asset-scan:verify asset-recording:verify
      # Expired artifacts require a fresh verify run; deploy-only retries never rebuild.
      - name: Store verified release images
        id: images_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-images
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: [verify, deploy_media]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.deploy_media.result == 'success' || (needs.deploy_media.result == 'skipped' && vars.MEMBER_VIDEO_ENABLED != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    outputs:
      commit: ${{ steps.release_outputs.outputs.commit }}
      image: ${{ steps.release_outputs.outputs.image }}
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: alive
      ACR_LOGIN_SERVER: alive.azurecr.io
      IMAGE_REPOSITORY: alive/asset-api
      SCAN_IMAGE_REPOSITORY: alive/asset-scan
      RECORDING_IMAGE_REPOSITORY: alive/asset-recording
      RESOURCE_GROUP: alive
      STORAGE_ACCOUNT_NAME: alivestoragebb99ee6e
      MIGRATION_JOB_NAME: asset-migrate
      SCAN_WORKER_APP_NAME: asset-scan-worker
      DERIVATIVE_JOB_NAME: asset-derivative
      API_APP_NAME: asset-api
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ASSET_WORKLOAD_CLIENT_ID: ${{ vars.ASSET_WORKLOAD_CLIENT_ID }}
      ASSET_WORKLOAD_AUDIENCE: ${{ vars.ASSET_WORKLOAD_AUDIENCE }}
      ASSET_READER_CALLER_APP_ID: api-gateway
      LINE_ATTACHMENT_CLIENT_ID: ${{ vars.LINE_ATTACHMENT_CLIENT_ID }}
      LINE_ATTACHMENT_OBJECT_ID: ${{ vars.LINE_ATTACHMENT_OBJECT_ID }}
      ASSET_EXTRACTOR_WORKLOAD_CLIENT_ID: ${{ vars.ASSET_EXTRACTOR_WORKLOAD_CLIENT_ID }}
      ASSET_EXTRACTOR_WORKLOAD_OBJECT_ID: ${{ vars.ASSET_EXTRACTOR_WORKLOAD_OBJECT_ID }}
      EXTRACTOR_ROLE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_extractor_app_role && 'true' || 'false' }}
      ASSET_WATERMARK_WORKLOAD_CLIENT_ID: ${{ vars.ASSET_WATERMARK_WORKLOAD_CLIENT_ID }}
      ASSET_WATERMARK_WORKLOAD_OBJECT_ID: ${{ vars.ASSET_WATERMARK_WORKLOAD_OBJECT_ID }}
      WATERMARK_ROLE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_watermark_app_role && 'true' || 'false' }}
      MEMBER_VIDEO_ENABLED: ${{ vars.MEMBER_VIDEO_ENABLED || 'false' }}
      RECORDING_HLS_ENABLED: ${{ vars.RECORDING_HLS_ENABLED || 'false' }}
      RECORDING_EVENTS_PROVISIONED: ${{ vars.RECORDING_EVENTS_PROVISIONED || 'false' }}
      RECORDING_EVENTS_ENABLED: ${{ vars.RECORDING_EVENTS_ENABLED || 'false' }}
      RECORDING_EVENTS_CHANGE_APPROVED: ${{ vars.RECORDING_EVENTS_CHANGE_APPROVED || 'false' }}
      RECORDING_LIVE_CPU: ${{ vars.RECORDING_LIVE_CPU || '4' }}
      RECORDING_PROCESSING_CPU: ${{ vars.RECORDING_PROCESSING_CPU || '2' }}
      RECORDING_PREVIEW_CPU: ${{ vars.RECORDING_PREVIEW_CPU || '1' }}
      RECORDING_SOURCE_ENABLED: ${{ vars.RECORDING_SOURCE_ENABLED || 'false' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MEDIA_KEY_ID: ${{ vars.ASSET_MEDIA_KEY_ID }}
      RELEASE_CONFIRMATION: ${{ github.event_name == 'push' && 'deploy-asset-api-production' || inputs.confirmation }}
      ACTIVATE_QUEUE_SCANNING: "true"
      EMBEDDED_SCAN_ENABLED: "false"
      DEPLOY_RETENTION_JOB: "true"
      RETENTION_SCHEDULE_ENABLED: "true"
      RETENTION_APPLY_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release configuration
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_CONFIRMATION" == "deploy-asset-api-production" ]]
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ASSET_WORKLOAD_CLIENT_ID ASSET_WORKLOAD_AUDIENCE LINE_ATTACHMENT_CLIENT_ID LINE_ATTACHMENT_OBJECT_ID; do
            test -n "${!name:-}" || { echo "Missing repository variable: ${name}" >&2; exit 1; }
          done
          for name in RETENTION_SCHEDULE_ENABLED RETENTION_APPLY_ENABLED RECORDING_HLS_ENABLED RECORDING_SOURCE_ENABLED; do
            case "${!name}" in
              true|false) ;;
              *) echo "${name} must be true or false" >&2; exit 1 ;;
            esac
          done
          if [[ -n "$ASSET_EXTRACTOR_WORKLOAD_CLIENT_ID" || -n "$ASSET_EXTRACTOR_WORKLOAD_OBJECT_ID" ]]; then
            test -n "$ASSET_EXTRACTOR_WORKLOAD_CLIENT_ID" && test -n "$ASSET_EXTRACTOR_WORKLOAD_OBJECT_ID" || { echo 'Extractor identity pair is incomplete' >&2; exit 1; }
          fi
          if [[ -n "$ASSET_WATERMARK_WORKLOAD_CLIENT_ID" || -n "$ASSET_WATERMARK_WORKLOAD_OBJECT_ID" ]]; then
            test -n "$ASSET_WATERMARK_WORKLOAD_CLIENT_ID" && test -n "$ASSET_WATERMARK_WORKLOAD_OBJECT_ID" || { echo 'Watermark worker identity pair is incomplete' >&2; exit 1; }
          fi
          case "$MEMBER_VIDEO_ENABLED" in
            true)
              test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$MEDIA_KEY_ID" || { echo 'Member video activation variables are missing' >&2; exit 1; }
              ;;
            false) ;;
            *) echo 'MEMBER_VIDEO_ENABLED must be true or false' >&2; exit 1 ;;
          esac
          if [[ "$RECORDING_HLS_ENABLED" == true ]]; then
            [[ "$MEMBER_VIDEO_ENABLED" == true ]] || { echo 'HLS requires member video' >&2; exit 1; }
          fi
          if [[ "$RECORDING_SOURCE_ENABLED" == true ]]; then
            [[ "$RECORDING_HLS_ENABLED" == true ]] || { echo 'Source processing requires HLS' >&2; exit 1; }
          fi
      - name: Set image tag
        run: echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Require immutable image artifact ID
        env:
          IMAGE_ARTIFACT_ID: ${{ needs.verify.outputs.image_artifact_id }}
        run: '[[ "$IMAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Download verified release images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.image_artifact_id }}
          path: ${{ runner.temp }}/release-images
          digest-mismatch: error
      - name: Verify and load release images
        id: images
        run: bash scripts/release-image-artifact.sh load "$RUNNER_TEMP/release-images" "$GITHUB_SHA"
      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --yes
      - name: Validate recording event rollout gate
        run: bash scripts/validate-recording-event-rollout.sh
      - name: Verify isolated runtime prerequisites
        run: |
          for vault in alive-asset-runtime-kv alive-asset-migrate-kv; do
            [[ "$(az keyvault show -g "$RESOURCE_GROUP" -n "$vault" --query properties.enableRbacAuthorization -o tsv --only-show-errors)" == true ]]
          done
          runtime_principal="$(az identity show -g "$RESOURCE_GROUP" -n asset-api-runtime-identity --query principalId -o tsv --only-show-errors)"
          migration_principal="$(az identity show -g "$RESOURCE_GROUP" -n asset-migrate-identity --query principalId -o tsv --only-show-errors)"
          runtime_vault="$(az keyvault show -g "$RESOURCE_GROUP" -n alive-asset-runtime-kv --query id -o tsv --only-show-errors)"
          migration_vault="$(az keyvault show -g "$RESOURCE_GROUP" -n alive-asset-migrate-kv --query id -o tsv --only-show-errors)"
          audit_vault="$(az keyvault show -g "$RESOURCE_GROUP" -n alive-vault --query id -o tsv --only-show-errors)"
          audit_token_scope="${audit_vault}/secrets/audit-log-production-token-asset-api"
          app_principal="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query identity.principalId -o tsv --only-show-errors)"
          scan_principal="$(az identity show -g "$RESOURCE_GROUP" -n asset-scan-identity --query principalId -o tsv --only-show-errors)"
          derivative_principal="$(az identity show -g "$RESOURCE_GROUP" -n asset-derivative-identity --query principalId -o tsv --only-show-errors)"
          refresh_principal="$(az identity show -g "$RESOURCE_GROUP" -n asset-signature-refresh-identity --query principalId -o tsv --only-show-errors)"
          storage_id="$(az storage account show -g "$RESOURCE_GROUP" -n "$STORAGE_ACCOUNT_NAME" --query id -o tsv --only-show-errors)"
          scan_queue_scope="${storage_id}/queueServices/default/queues/asset-scan"
          poison_queue_scope="${storage_id}/queueServices/default/queues/asset-scan-poison"
          derivative_queue_scope="${storage_id}/queueServices/default/queues/asset-derivative"
          derivative_poison_queue_scope="${storage_id}/queueServices/default/queues/asset-derivative-poison"
          blob_scope="${storage_id}/blobServices/default/containers/assets"
          signature_scope="${storage_id}/blobServices/default/containers/asset-signatures"
          [[ "$(az role assignment list --scope "$runtime_vault" --assignee-object-id "$runtime_principal" --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$migration_vault" --assignee-object-id "$migration_principal" --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$audit_token_scope" --assignee-object-id "$runtime_principal" --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          az resource show --ids "$scan_queue_scope" --api-version 2023-05-01 --only-show-errors --output none
          [[ "$(az role assignment list --scope "$scan_queue_scope" --assignee-object-id "$app_principal" --query "[?roleDefinitionName=='Storage Queue Data Message Sender'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$scan_queue_scope" --assignee-object-id "$scan_principal" --query "[?roleDefinitionName=='Storage Queue Data Message Processor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$scan_queue_scope" --assignee-object-id "$scan_principal" --query "[?roleDefinitionName=='Storage Queue Data Reader'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$poison_queue_scope" --assignee-object-id "$scan_principal" --query "[?roleDefinitionName=='Storage Queue Data Contributor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$blob_scope" --assignee-object-id "$scan_principal" --query "[?roleDefinitionName=='Storage Blob Data Reader'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$signature_scope" --assignee-object-id "$scan_principal" --query "[?roleDefinitionName=='Storage Blob Data Reader'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$signature_scope" --assignee-object-id "$refresh_principal" --query "[?roleDefinitionName=='Storage Blob Data Contributor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          az resource show --ids "$derivative_queue_scope" --api-version 2023-05-01 --only-show-errors --output none
          az resource show --ids "$derivative_poison_queue_scope" --api-version 2023-05-01 --only-show-errors --output none
          [[ "$(az role assignment list --scope "$derivative_queue_scope" --assignee-object-id "$app_principal" --query "[?roleDefinitionName=='Storage Queue Data Message Sender'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$derivative_queue_scope" --assignee-object-id "$derivative_principal" --query "[?roleDefinitionName=='Storage Queue Data Message Processor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$derivative_queue_scope" --assignee-object-id "$derivative_principal" --query "[?roleDefinitionName=='Storage Queue Data Reader'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$derivative_poison_queue_scope" --assignee-object-id "$derivative_principal" --query "[?roleDefinitionName=='Storage Queue Data Contributor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$blob_scope" --assignee-object-id "$derivative_principal" --query "[?roleDefinitionName=='Storage Blob Data Contributor'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az role assignment list --scope "$runtime_vault" --assignee-object-id "$derivative_principal" --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" -o tsv --only-show-errors)" == "1" ]]
          [[ "$(az resource show --ids "$runtime_vault/secrets/database-url" --api-version 2024-11-01 --query properties.attributes.enabled -o tsv --only-show-errors)" == "true" ]]
          [[ "$(az resource show --ids "$runtime_vault/secrets/jobs-database-url" --api-version 2024-11-01 --query properties.attributes.enabled -o tsv --only-show-errors)" == "true" ]]
          [[ "$(az resource show --ids "$migration_vault/secrets/database-url" --api-version 2024-11-01 --query properties.attributes.enabled -o tsv --only-show-errors)" == "true" ]]
          [[ "$(az resource show --ids "$audit_token_scope" --api-version 2024-11-01 --query properties.attributes.enabled -o tsv --only-show-errors)" == "true" ]]
          if [[ "$MEMBER_VIDEO_ENABLED" == true ]]; then
            for secret in member-video-r2-access-key-id member-video-r2-secret-access-key member-video-media-private-key-pem; do
              [[ "$(az resource show --ids "${runtime_vault}/secrets/${secret}" --api-version 2024-11-01 --query properties.attributes.enabled -o tsv --only-show-errors)" == true ]]
            done
          fi
          if [[ "$RECORDING_SOURCE_ENABLED" == true ]]; then
            source_storage_id="$(az storage account show -g "$RESOURCE_GROUP" -n aliverecordingsprod --query id -o tsv --only-show-errors)"
            source_scope="${source_storage_id}/blobServices/default/containers/recording-sources"
            [[ "$(az resource show --ids "$source_scope" --api-version 2023-05-01 --query properties.publicAccess -o tsv --only-show-errors)" == None ]]
            for source_principal in "$app_principal" "$runtime_principal"; do
              [[ "$(az role assignment list --scope "$source_scope" --assignee-object-id "$source_principal" --query "[?roleDefinitionName=='Storage Blob Data Contributor'] | length(@)" -o tsv --only-show-errors)" == 1 ]]
              [[ "$(az role assignment list --scope "$source_storage_id" --assignee-object-id "$source_principal" --query "[?roleDefinitionName=='Storage Blob Delegator'] | length(@)" -o tsv --only-show-errors)" == 1 ]]
            done
          fi
      - name: Verify recording event permission prerequisites
        if: env.RECORDING_EVENTS_ENABLED == 'true'
        run: bash scripts/verify-recording-event-permissions.sh
      - name: Capture rollback revision
        run: |
          resolve_image_ref() {
            local image="$1"
            if [[ "$image" == *@sha256:* ]]; then printf '%s\n' "$image"; return; fi
            local image_spec="${image#${ACR_LOGIN_SERVER}/}"
            local repository="${image_spec%:*}"
            local digest
            digest="$(az acr repository show --name "$ACR_NAME" --image "$image_spec" --query digest -o tsv --only-show-errors)"
            [[ "$digest" == sha256:* ]]
            printf '%s/%s@%s\n' "$ACR_LOGIN_SERVER" "$repository" "$digest"
          }
          revision="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
          image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --revision "$revision" --query properties.template.containers[0].image -o tsv --only-show-errors)"
          {
            echo "PREVIOUS_READY_REVISION=$revision"
            echo "PREVIOUS_IMAGE_REF=$(resolve_image_ref "$image")"
          } >> "$GITHUB_ENV"
      - name: Capture existing worker recovery state
        id: capture_workers
        run: python3 scripts/worker-release-rollback.py capture "$RUNNER_TEMP/worker-rollback.json"
      - name: Capture recording trigger rollback
        if: env.MEMBER_VIDEO_ENABLED == 'true'
        run: python3 scripts/recording-event-topology.py capture "$RUNNER_TEMP/recording-topology.json"
      - name: Publish verified images
        env:
          API_IMAGE_ID: ${{ steps.images.outputs.api_image_id }}
          SCAN_IMAGE_ID: ${{ steps.images.outputs.scan_image_id }}
          RECORDING_IMAGE_ID: ${{ steps.images.outputs.recording_image_id }}
        run: |
          az acr login --name "$ACR_NAME" --only-show-errors
          docker tag "$API_IMAGE_ID" "${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker tag "$SCAN_IMAGE_ID" "${ACR_LOGIN_SERVER}/${SCAN_IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ACR_LOGIN_SERVER}/${SCAN_IMAGE_REPOSITORY}:${IMAGE_TAG}"
          if [[ "$MEMBER_VIDEO_ENABLED" == true ]]; then
            docker tag "$RECORDING_IMAGE_ID" "${ACR_LOGIN_SERVER}/${RECORDING_IMAGE_REPOSITORY}:${IMAGE_TAG}"
            docker push "${ACR_LOGIN_SERVER}/${RECORDING_IMAGE_REPOSITORY}:${IMAGE_TAG}"
          fi
      - name: Resolve immutable image digest
        run: |
          digest="$(az acr repository show --name "$ACR_NAME" --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" --query digest -o tsv --only-show-errors)"
          [[ "$digest" == sha256:* ]]
          echo "IMAGE_REF=${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_ENV"
          scan_digest="$(az acr repository show --name "$ACR_NAME" --image "${SCAN_IMAGE_REPOSITORY}:${IMAGE_TAG}" --query digest -o tsv --only-show-errors)"
          [[ "$scan_digest" == sha256:* ]]
          echo "SCAN_IMAGE_REF=${ACR_LOGIN_SERVER}/${SCAN_IMAGE_REPOSITORY}@${scan_digest}" >> "$GITHUB_ENV"
          if [[ "$MEMBER_VIDEO_ENABLED" == true ]]; then
            recording_digest="$(az acr repository show --name "$ACR_NAME" --image "${RECORDING_IMAGE_REPOSITORY}:${IMAGE_TAG}" --query digest -o tsv --only-show-errors)"
            [[ "$recording_digest" == sha256:* ]]
            echo "RECORDING_IMAGE_REF=${ACR_LOGIN_SERVER}/${RECORDING_IMAGE_REPOSITORY}@${recording_digest}" >> "$GITHUB_ENV"
          else
            echo "RECORDING_IMAGE_REF=${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_ENV"
          fi
      - name: Verify published image identities
        env:
          API_IMAGE_ID: ${{ steps.images.outputs.api_image_id }}
          SCAN_IMAGE_ID: ${{ steps.images.outputs.scan_image_id }}
          RECORDING_IMAGE_ID: ${{ steps.images.outputs.recording_image_id }}
        run: |
          docker pull "$IMAGE_REF"
          docker pull "$SCAN_IMAGE_REF"
          [[ "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" == "$API_IMAGE_ID" ]]
          [[ "$(docker image inspect --format '{{.Id}}' "$SCAN_IMAGE_REF")" == "$SCAN_IMAGE_ID" ]]
          if [[ "$MEMBER_VIDEO_ENABLED" == true ]]; then
            docker pull "$RECORDING_IMAGE_REF"
            [[ "$(docker image inspect --format '{{.Id}}' "$RECORDING_IMAGE_REF")" == "$RECORDING_IMAGE_ID" ]]
          fi
      - name: Scan immutable images
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME" --only-show-errors
          docker pull "$IMAGE_REF"
          docker pull "$SCAN_IMAGE_REF"
          echo '- Scanner: `ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969`' >> "$GITHUB_STEP_SUMMARY"
          sh scripts/scan-image.sh "$IMAGE_REF"
          sh scripts/scan-image.sh "$SCAN_IMAGE_REF"
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            version --format json | jq -r '"- Trivy: " + .Version, "- Vulnerability DB updated: " + .VulnerabilityDB.UpdatedAt' >> "$GITHUB_STEP_SUMMARY"
      - name: Scan immutable recording image
        if: env.MEMBER_VIDEO_ENABLED == 'true'
        run: |
          docker pull "$RECORDING_IMAGE_REF"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$RECORDING_IMAGE_REF"
      - name: Reject destructive infrastructure changes
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters recordingEventsProvisioned="$RECORDING_EVENTS_PROVISIONED" recordingEventsEnabled="$RECORDING_EVENTS_ENABLED" recordingLiveCPU="$RECORDING_LIVE_CPU" recordingProcessingCPU="$RECORDING_PROCESSING_CPU" recordingPreviewCPU="$RECORDING_PREVIEW_CPU" recordingHLSEnabled="$RECORDING_HLS_ENABLED" recordingSourceEnabled="$RECORDING_SOURCE_ENABLED" storageAccountName="$STORAGE_ACCOUNT_NAME" migrationImage="$IMAGE_REF" runtimeImage="$IMAGE_REF" scanWorkerImage="$SCAN_IMAGE_REF" recordingImage="$RECORDING_IMAGE_REF" memberVideoEnabled="$MEMBER_VIDEO_ENABLED" recordingR2AccountId="$CLOUDFLARE_ACCOUNT_ID" mediaKeyId="$MEDIA_KEY_ID" deployRuntime=true deployMigrationJob=true deployScanJob=true deployScanWorker=true provisionScanWarmInfrastructure=false deploySignatureRefreshJob=true deployDerivativeJob=true deployRetentionJob="$DEPLOY_RETENTION_JOB" retentionScheduleEnabled="$RETENTION_SCHEDULE_ENABLED" retentionApplyEnabled="$RETENTION_APPLY_ENABLED" scanDispatchEnabled="$ACTIVATE_QUEUE_SCANNING" embeddedScanEnabled="$EMBEDDED_SCAN_ENABLED" workloadAuthClientId="$ASSET_WORKLOAD_CLIENT_ID" workloadAuthAudience="$ASSET_WORKLOAD_AUDIENCE" lineAttachmentClientId="$LINE_ATTACHMENT_CLIENT_ID" lineAttachmentObjectId="$LINE_ATTACHMENT_OBJECT_ID" extractorClientId="$ASSET_EXTRACTOR_WORKLOAD_CLIENT_ID" extractorObjectId="$ASSET_EXTRACTOR_WORKLOAD_OBJECT_ID" watermarkWorkerClientId="$ASSET_WATERMARK_WORKLOAD_CLIENT_ID" watermarkWorkerObjectId="$ASSET_WATERMARK_WORKLOAD_OBJECT_ID" readerCallerAppId="$ASSET_READER_CALLER_APP_ID" provisionPermissions=false manageSharedInfrastructure=false \
            --validation-level Provider --result-format FullResourcePayloads --no-pretty-print --only-show-errors \
            --output json > what-if.json
          if [[ "$RECORDING_EVENTS_PROVISIONED" == true ]]; then
            export RECORDING_WORKER_PRINCIPAL_ID="$(az identity show -g "$RESOURCE_GROUP" -n asset-api-runtime-identity --query principalId -o tsv --only-show-errors)"
            export RECORDING_API_PRINCIPAL_ID="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query identity.principalId -o tsv --only-show-errors)"
            bash scripts/check-recording-event-what-if.sh what-if.json
          else
            ./scripts/check-what-if.sh what-if.json
          fi
      - name: Verify existing extractor asset role
        if: env.ASSET_EXTRACTOR_WORKLOAD_CLIENT_ID != '' && env.EXTRACTOR_ROLE_APPROVED != 'true'
        run: bash scripts/ensure-workload-app-role.sh check
      - name: Authorize reviewed exact extractor asset role
        if: env.ASSET_EXTRACTOR_WORKLOAD_CLIENT_ID != '' && env.EXTRACTOR_ROLE_APPROVED == 'true'
        run: bash scripts/ensure-workload-app-role.sh apply
      - name: Verify existing watermark worker asset role
        if: env.ASSET_WATERMARK_WORKLOAD_CLIENT_ID != '' && env.WATERMARK_ROLE_APPROVED != 'true'
        env:
          ROLE_SUBJECT: watermark
        run: bash scripts/ensure-workload-app-role.sh check
      - name: Authorize reviewed exact watermark worker asset role
        if: env.ASSET_WATERMARK_WORKLOAD_CLIENT_ID != '' && env.WATERMARK_ROLE_APPROVED == 'true'
        env:
          ROLE_SUBJECT: watermark
        run: bash scripts/ensure-workload-app-role.sh apply
      - name: Update migration job
        run: |
          az deployment group create \
            --name "asset-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" --template-file infra/main.bicep \
            --parameters storageAccountName="$STORAGE_ACCOUNT_NAME" migrationImage="$IMAGE_REF" runtimeImage="$IMAGE_REF" deployRuntime=false deployMigrationJob=true provisionPermissions=false manageSharedInfrastructure=false \
            --only-show-errors --output none
      - name: Run migrations
        run: |
          execution_name="$(az containerapp job start -g "$RESOURCE_GROUP" -n "$MIGRATION_JOB_NAME" --query name -o tsv --only-show-errors)"
          for attempt in {1..60}; do
            status="$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$MIGRATION_JOB_NAME" --query "[?name=='${execution_name}'].properties.status | [0]" -o tsv --only-show-errors)"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Canceled|Cancelled|Stopped)
                az containerapp job logs show -g "$RESOURCE_GROUP" -n "$MIGRATION_JOB_NAME" --execution "$execution_name" --container asset-migrate --tail 200 || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Migration timed out" >&2
          exit 1
      - name: Quiesce legacy recording schedule before activation
        id: quiesce_recording
        if: env.MEMBER_VIDEO_ENABLED == 'true'
        run: python3 scripts/recording-event-topology.py quiesce "$RUNNER_TEMP/recording-topology.json"
      - name: Deploy API
        id: deploy_runtime
        run: |
          az deployment group create \
            --name "asset-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" --template-file infra/main.bicep \
            --parameters recordingEventsProvisioned="$RECORDING_EVENTS_PROVISIONED" recordingEventsEnabled="$RECORDING_EVENTS_ENABLED" recordingLiveCPU="$RECORDING_LIVE_CPU" recordingProcessingCPU="$RECORDING_PROCESSING_CPU" recordingPreviewCPU="$RECORDING_PREVIEW_CPU" recordingHLSEnabled="$RECORDING_HLS_ENABLED" recordingSourceEnabled="$RECORDING_SOURCE_ENABLED" storageAccountName="$STORAGE_ACCOUNT_NAME" migrationImage="$IMAGE_REF" runtimeImage="$IMAGE_REF" scanWorkerImage="$SCAN_IMAGE_REF" recordingImage="$RECORDING_IMAGE_REF" memberVideoEnabled="$MEMBER_VIDEO_ENABLED" recordingR2AccountId="$CLOUDFLARE_ACCOUNT_ID" mediaKeyId="$MEDIA_KEY_ID" deployRuntime=true deployMigrationJob=true deployScanJob=true deployScanWorker=true provisionScanWarmInfrastructure=false deploySignatureRefreshJob=true deployDerivativeJob=true deployRetentionJob="$DEPLOY_RETENTION_JOB" retentionScheduleEnabled="$RETENTION_SCHEDULE_ENABLED" retentionApplyEnabled="$RETENTION_APPLY_ENABLED" scanDispatchEnabled="$ACTIVATE_QUEUE_SCANNING" embeddedScanEnabled="$EMBEDDED_SCAN_ENABLED" workloadAuthClientId="$ASSET_WORKLOAD_CLIENT_ID" workloadAuthAudience="$ASSET_WORKLOAD_AUDIENCE" lineAttachmentClientId="$LINE_ATTACHMENT_CLIENT_ID" lineAttachmentObjectId="$LINE_ATTACHMENT_OBJECT_ID" extractorClientId="$ASSET_EXTRACTOR_WORKLOAD_CLIENT_ID" extractorObjectId="$ASSET_EXTRACTOR_WORKLOAD_OBJECT_ID" watermarkWorkerClientId="$ASSET_WATERMARK_WORKLOAD_CLIENT_ID" watermarkWorkerObjectId="$ASSET_WATERMARK_WORKLOAD_OBJECT_ID" readerCallerAppId="$ASSET_READER_CALLER_APP_ID" provisionPermissions=false manageSharedInfrastructure=false \
            --only-show-errors --output none
      - name: Verify revision health
        run: |
          for attempt in {1..60}; do
            latest="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestRevisionName -o tsv --only-show-errors)"
            ready="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
            if [[ -n "$latest" && "$latest" == "$ready" ]]; then
              image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --revision "$ready" --query properties.template.containers[0].image -o tsv --only-show-errors)"
              [[ "$image" == "$IMAGE_REF" ]] && exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify scan worker release
        run: |
          worker_image="$(az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.containers[0].image -o tsv --only-show-errors)"
          [[ "$worker_image" == "$SCAN_IMAGE_REF" ]]
          az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query 'properties.template.containers[0].resources' -o json --only-show-errors \
            | jq -e '.cpu == 1.5 and .memory == "3Gi" and .ephemeralStorage == "8Gi"' >/dev/null
          [[ "$(az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.scale.minReplicas -o tsv --only-show-errors)" == "0" ]]
          [[ "$(az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.scale.maxReplicas -o tsv --only-show-errors)" == "5" ]]
          [[ "$(az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.scale.pollingInterval -o tsv --only-show-errors)" == "5" ]]
          [[ "$(az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.scale.cooldownPeriod -o tsv --only-show-errors)" == "120" ]]
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n asset-scan --query properties.configuration.triggerType -o tsv --only-show-errors)" == "Manual" ]]
          # Meeting warm windows are the cron rules declared in infra/main.bicep.
          az containerapp show -g "$RESOURCE_GROUP" -n "$SCAN_WORKER_APP_NAME" --query properties.template.scale.rules -o json --only-show-errors \
            | python3 scripts/verify-scan-worker-scale.py
      - name: Verify derivative job release
        run: |
          derivative_image="$(az containerapp job show -g "$RESOURCE_GROUP" -n "$DERIVATIVE_JOB_NAME" --query properties.template.containers[0].image -o tsv --only-show-errors)"
          [[ "$derivative_image" == "$IMAGE_REF" ]]
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n "$DERIVATIVE_JOB_NAME" --query properties.configuration.eventTriggerConfig.scale.minExecutions -o tsv --only-show-errors)" == "0" ]]
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n "$DERIVATIVE_JOB_NAME" --query properties.configuration.eventTriggerConfig.scale.maxExecutions -o tsv --only-show-errors)" == "3" ]]
      - name: Verify recording validation job release
        if: env.MEMBER_VIDEO_ENABLED == 'true'
        run: |
          [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n asset-recording-validation --query properties.template.containers[0].image -o tsv --only-show-errors)" == "$RECORDING_IMAGE_REF" ]]
          bash scripts/verify-recording-jobs.sh
          if [[ "$RECORDING_EVENTS_ENABLED" != true ]]; then
            [[ "$(az containerapp job show -g "$RESOURCE_GROUP" -n asset-recording-validation --query properties.configuration.scheduleTriggerConfig.cronExpression -o tsv --only-show-errors)" == '*/1 * * * *' ]]
          fi
      - name: Retire scan warmer Job
        # Planned deletion: the scan worker cron rules (verified above) replace the
        # per-minute warmer, and incremental Bicep deployments never delete a Job
        # the template stopped declaring. Idempotent; the last image reference is
        # logged for rollback and ACR retention before deletion.
        run: |
          job=asset-scan-warmer
          count() {
            az containerapp job list -g "$RESOURCE_GROUP" --query "length([?name=='${job}'])" -o tsv --only-show-errors
          }
          present="$(count)"
          if [[ "$present" == 0 ]]; then
            echo "${job} is already absent"
            exit 0
          fi
          [[ "$present" == 1 ]]
          image="$(az containerapp job show -g "$RESOURCE_GROUP" -n "$job" --query properties.template.containers[0].image -o tsv --only-show-errors)"
          echo "Retiring ${job}; last image: ${image}"
          echo "- Retired \`${job}\`; last image \`${image}\`" >> "$GITHUB_STEP_SUMMARY"
          az containerapp job delete -g "$RESOURCE_GROUP" -n "$job" --yes --only-show-errors --output none
          for attempt in {1..30}; do
            if [[ "$(count)" == 0 ]]; then
              echo "${job} deleted"
              exit 0
            fi
            sleep 10
          done
          echo "${job} still exists after deletion" >&2
          exit 1
      - name: Capture healthy release
        id: release_outputs
        run: |
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Settle interrupted runtime deployment
        id: settle_runtime
        if: ${{ (failure() || cancelled()) && (steps.deploy_runtime.outcome == 'success' || steps.deploy_runtime.outcome == 'failure' || steps.deploy_runtime.outcome == 'cancelled') }}
        run: python3 scripts/worker-release-rollback.py settle "asset-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Roll back failed runtime
        if: ${{ (failure() || cancelled()) && env.PREVIOUS_READY_REVISION != '' && ((steps.deploy_runtime.outcome == 'success' || steps.deploy_runtime.outcome == 'failure' || steps.deploy_runtime.outcome == 'cancelled') || steps.quiesce_recording.outputs.paused == 'true') && (steps.settle_runtime.outcome == 'success' || steps.deploy_runtime.outcome == 'skipped') }}
        run: |
          if [[ "$MEMBER_VIDEO_ENABLED" == true && "$RECORDING_EVENTS_PROVISIONED" == true ]]; then
            python3 scripts/recording-event-topology.py pause "$RUNNER_TEMP/recording-topology.json"
          fi
          az containerapp revision copy -g "$RESOURCE_GROUP" -n "$API_APP_NAME" \
            --from-revision "$PREVIOUS_READY_REVISION" --image "$PREVIOUS_IMAGE_REF" \
            --revision-suffix "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --only-show-errors --output none
          for attempt in {1..60}; do
            latest="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestRevisionName -o tsv --only-show-errors)"
            ready="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
            if [[ -n "$latest" && "$latest" == "$ready" ]]; then
              image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --revision "$ready" --query properties.template.containers[0].image -o tsv --only-show-errors)"
              if [[ "$image" == "$PREVIOUS_IMAGE_REF" ]]; then
                if [[ "$MEMBER_VIDEO_ENABLED" == true && "$RECORDING_EVENTS_PROVISIONED" == true ]]; then
                  python3 scripts/recording-event-topology.py restore "$RUNNER_TEMP/recording-topology.json"
                fi
                exit 0
              fi
            fi
            sleep 10
          done
          exit 1
      - name: Restore existing worker definitions on failure
        if: ${{ (failure() || cancelled()) && steps.capture_workers.outcome == 'success' && steps.settle_runtime.outcome == 'success' && (steps.deploy_runtime.outcome == 'success' || steps.deploy_runtime.outcome == 'failure' || steps.deploy_runtime.outcome == 'cancelled') }}
        run: python3 scripts/worker-release-rollback.py restore "$RUNNER_TEMP/worker-rollback.json"
      - name: Summarize worker recovery without configuration values
        if: ${{ (failure() || cancelled()) && steps.capture_workers.outcome == 'success' }}
        run: python3 scripts/worker-release-rollback.py summary "$RUNNER_TEMP/worker-rollback.json" > "$RUNNER_TEMP/worker-rollback-summary.json"
      - name: Preserve worker recovery summary
        if: ${{ (failure() || cancelled()) && steps.capture_workers.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-rollback-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-rollback-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve non-secret recording rollback topology
        if: ${{ (failure() || cancelled()) && env.RECORDING_EVENTS_PROVISIONED == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recording-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recording-topology.json
          if-no-files-found: ignore
          retention-days: 7

  deploy_media:
    needs: verify
    if: ${{ vars.MEMBER_MEDIA_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_CONFIRMATION: ${{ github.event_name == 'push' && 'deploy-asset-api-production' || inputs.confirmation }}
    steps:
      - name: Validate media release boundary
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_CONFIRMATION" == "deploy-asset-api-production" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: member-media-${{ github.sha }}
          path: workers/member-media/pages/production/dist
          digest-mismatch: error
      - name: Capture previous media deployment
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/hhc-member-media"
          project="$(curl --silent --show-error --fail --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api")"
          jq -e '.success == true' <<<"$project" >/dev/null
          previous="$(jq -r '.result.canonical_deployment.id // empty' <<<"$project")"
          if [[ -z "$previous" ]]; then
            domains="$(curl --silent --show-error --fail --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api/domains")"
            jq -e '.success == true and (.result | length == 0)' <<<"$domains" >/dev/null || {
              echo 'First media deployment requires no custom domain; refusing an unrollbackable public release' >&2
              exit 1
            }
          fi
          echo "PREVIOUS_MEDIA_DEPLOYMENT=$previous" >> "$GITHUB_ENV"
      - name: Deploy verified private media function
        id: deploy_media_function
        working-directory: workers/member-media
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm ci
          cd pages/production
          ../../node_modules/.bin/wrangler pages secret list --project-name hhc-member-media | grep -Fq MEDIA_PUBLIC_KEYS
          ../../node_modules/.bin/wrangler pages deploy dist --project-name hhc-member-media --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify unauthenticated media is denied
        run: |
          url='https://hhc-member-media.pages.dev/videos/rec-1/packages/0123456789abcdef0123456789abcdef/sessions/scope-1/master.m3u8'
          for method in GET HEAD; do
            status=''
            for attempt in {1..20}; do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request "$method" "$url")"
              [[ "$status" == 401 ]] && break
              sleep 3
            done
            [[ "$status" == 401 ]]
          done
      - name: Restore previous media deployment on failure
        if: ${{ (failure() || cancelled()) && env.PREVIOUS_MEDIA_DEPLOYMENT != '' && (steps.deploy_media_function.outcome == 'success' || steps.deploy_media_function.outcome == 'failure' || steps.deploy_media_function.outcome == 'cancelled') }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/hhc-member-media"
          rollback="$(curl --silent --show-error --fail --request POST --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api/deployments/${PREVIOUS_MEDIA_DEPLOYMENT}/rollback")"
          jq -e '.success == true' <<<"$rollback" >/dev/null

  publish_openapi:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      STORAGE_ACCOUNT: hhcapidocsprod
      CONTAINER: api-docs-asset-api
      API_DOCS_AZURE_CLIENT_ID: ${{ vars.API_DOCS_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RELEASE_COMMIT: ${{ needs.deploy.outputs.commit }}
      RELEASE_IMAGE: ${{ needs.deploy.outputs.image }}
      FAIL_OPENAPI_BEFORE_POINTER: ${{ inputs.fail_openapi_before_pointer && github.run_attempt == 1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified governance manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: data-governance-${{ needs.deploy.outputs.commit }}
          path: .artifacts/data-governance/export
          digest-mismatch: error
      - name: Validate publication configuration
        run: |
          [[ "$RELEASE_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$RELEASE_IMAGE" == *@sha256:* ]]
          for name in API_DOCS_AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "Missing repository variable: ${name}" >&2; exit 1; }
          done
      - name: Sign in with API docs publisher identity
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.API_DOCS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish production OpenAPI contract
        run: |
          spec_blob="specs/${GITHUB_SHA}/openapi.yaml"
          spec_sha256="$(sha256sum docs/openapi.yaml | cut -d " " -f 1)"
          is_canonical_run_id() { [[ "$1" =~ ^[1-9][0-9]*$ ]]; }
          if ! is_canonical_run_id "$GITHUB_RUN_ID"; then
            echo "Invalid GITHUB_RUN_ID: expected canonical positive decimal" >&2
            exit 1
          fi
          spec_exists="$(az storage blob exists \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$spec_blob" \
            --auth-mode login \
            --only-show-errors \
            --query exists \
            --output tsv)"
          if [[ "$spec_exists" == "true" ]]; then
            existing_spec="$(mktemp)"
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "$spec_blob" \
              --file "$existing_spec" \
              --auth-mode login \
              --no-progress \
              --only-show-errors \
              --output none
            [[ "$(sha256sum "$existing_spec" | cut -d " " -f 1)" == "$spec_sha256" ]] || {
              echo "Existing OpenAPI spec hash does not match" >&2
              exit 1
            }
          else
            az storage blob upload \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "$spec_blob" \
              --file docs/openapi.yaml \
              --auth-mode login \
              --overwrite false \
              --only-show-errors \
              --output none
          fi

          jq -n \
            --arg service asset-api \
            --arg commit "$RELEASE_COMMIT" \
            --arg image "$RELEASE_IMAGE" \
            --arg specBlob "$spec_blob" \
            --arg specSha256 "$spec_sha256" \
            --arg releaseUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, service: $service, commit: $commit, image: $image, specBlob: $specBlob, specSha256: $specSha256, releaseUrl: $releaseUrl, publishedAt: $publishedAt}' \
            > current.json

          if [[ "$FAIL_OPENAPI_BEFORE_POINTER" == "true" ]]; then
            echo "Requested failure before API docs pointer upload" >&2
            exit 1
          fi

          pointer_exists="$(az storage blob exists \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name current.json \
            --auth-mode login \
            --only-show-errors \
            --query exists \
            --output tsv)"
          if [[ "$pointer_exists" == "true" ]]; then
            current_pointer="$(mktemp)"
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name current.json \
              --file "$current_pointer" \
              --auth-mode login \
              --no-progress \
              --only-show-errors \
              --output none
            current_run_id="$(jq -er --arg release_url_prefix "https://github.com/${GITHUB_REPOSITORY}/actions/runs/" '
              .releaseUrl? as $release_url
              | if ($release_url | type) == "string" and ($release_url | startswith($release_url_prefix))
                then ($release_url | ltrimstr($release_url_prefix))
                else empty
                end
            ' "$current_pointer" 2>/dev/null)" || {
              echo "Invalid existing API docs pointer: expected canonical GitHub workflow run ID" >&2
              exit 1
            }
            if ! is_canonical_run_id "$current_run_id"; then
              echo "Invalid existing API docs pointer: expected canonical GitHub workflow run ID" >&2
              exit 1
            fi
            export LC_ALL=C
            if [[ ${#current_run_id} -gt ${#GITHUB_RUN_ID} ]] || { [[ ${#current_run_id} -eq ${#GITHUB_RUN_ID} ]] && [[ "$current_run_id" > "$GITHUB_RUN_ID" || "$current_run_id" == "$GITHUB_RUN_ID" ]]; }; then
              echo "API docs pointer already belongs to workflow run $current_run_id; skipping stale or rerun publication"
              exit 0
            fi
          fi

          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name current.json \
            --file current.json \
            --auth-mode login \
            --overwrite true \
            --only-show-errors \
            --output none
      - name: Publish verified governance manifest
        env:
          SERVICE: asset-api
          RELEASE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GOVERNANCE_DIR: ${{ github.workspace }}/.artifacts/data-governance/export
        run: bash scripts/publish-data-governance.sh
