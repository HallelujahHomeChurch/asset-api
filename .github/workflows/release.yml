name: Production Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - infra/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: asset-api-production
  cancel-in-progress: false

env:
  ACR_NAME: alive
  ACR_LOGIN_SERVER: alive.azurecr.io
  IMAGE_REPOSITORY: alive/asset-api
  RESOURCE_GROUP: alive
  CONTAINER_APP_NAME: asset-api
  API_GATEWAY_APP_NAME: api-gateway

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set image tag
        run: echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "${GITHUB_ENV}"
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          ./scripts/test-release-workflow.sh
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --yes
      - name: Capture rollback revision
        run: |
          revision="$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" \
            --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
          test -n "$revision"
          image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" \
            --revision "$revision" \
            --query properties.template.containers[0].image -o tsv --only-show-errors)"
          test -n "$image"
          if [[ "$image" == *@sha256:* ]]; then
            previous_image_ref="$image"
          else
            repository_and_tag="${image#${ACR_LOGIN_SERVER}/}"
            digest="$(az acr repository show \
              --name "$ACR_NAME" \
              --image "$repository_and_tag" \
              --query digest -o tsv --only-show-errors)"
            test -n "$digest"
            previous_image_ref="${ACR_LOGIN_SERVER}/${repository_and_tag%:*}@${digest}"
          fi
          {
            echo "PREVIOUS_READY_REVISION=$revision"
            echo "PREVIOUS_IMAGE_REF=$previous_image_ref"
          } >> "$GITHUB_ENV"
      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "${ACR_NAME}" \
            --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --file Dockerfile \
            .
      - name: Resolve immutable image digest
        run: |
          digest="$(az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --query digest -o tsv --only-show-errors)"
          [[ "$digest" == sha256:* ]]
          echo "IMAGE_REF=${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_ENV"
      - name: Deploy image
        id: deploy_runtime
        run: |
          az containerapp update \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${CONTAINER_APP_NAME}" \
            --image "${IMAGE_REF}" \
            --only-show-errors \
            --output none
      - name: Wait for ready revision
        run: |
          for attempt in {1..30}; do
            state="$(az containerapp show \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${CONTAINER_APP_NAME}" \
              --query "join('|', [properties.latestRevisionName, properties.latestReadyRevisionName, properties.runningStatus, properties.template.containers[0].image])" \
              --output tsv)"
            IFS='|' read -r latest ready running_status deployed_image <<< "${state}"
            if [[ "${latest}" == "${ready}" && "${running_status}" == "Running" && "${deployed_image}" == "${IMAGE_REF}" ]]; then
              echo "Deployed ${IMAGE_REF} to ${ready}"
              exit 0
            fi
            sleep 10
          done
          echo "Latest revision did not become ready" >&2
          exit 1
      - name: Verify Dapr readiness through API gateway
        run: |
          output="$(timeout 60s script -q -e -c \
            "az containerapp exec -g \"$RESOURCE_GROUP\" -n \"$API_GATEWAY_APP_NAME\" --command \"/usr/bin/wget -S -O - http://localhost:3500/v1.0/invoke/asset-api/method/ready\"" \
            /dev/null 2>&1)"
          output="${output//$'\r'/}"
          printf '%s\n' "$output"
          grep -Eq 'HTTP/1\.[01][[:space:]]+200' <<< "$output"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"' <<< "$output"
      - name: Roll back failed runtime
        if: ${{ failure() && steps.deploy_runtime.outcome != 'skipped' }}
        run: |
          az containerapp revision copy \
            -g "$RESOURCE_GROUP" \
            -n "$CONTAINER_APP_NAME" \
            --from-revision "$PREVIOUS_READY_REVISION" \
            --image "$PREVIOUS_IMAGE_REF" \
            --revision-suffix "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --only-show-errors \
            --output none

          for attempt in {1..60}; do
            latest="$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" \
              --query properties.latestRevisionName -o tsv --only-show-errors)"
            ready="$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" \
              --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
            if [[ -n "$latest" && "$latest" == "$ready" ]]; then
              image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" \
              --revision "$ready" \
              --query properties.template.containers[0].image -o tsv --only-show-errors)"
              [[ "$image" == "$PREVIOUS_IMAGE_REF" ]] && exit 0
            fi
            sleep 10
          done
          echo "Asset API rollback did not become ready" >&2
          exit 1
