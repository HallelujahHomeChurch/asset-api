openapi: 3.1.0
info:
  title: HHC Asset API
  version: 1.0.0
  description: Asset owns bytes, upload validation, scanning, derivatives, grants, downloads, and deletion lifecycle. CMS business records remain owned by the caller.
servers:
  - url: http://asset-api
    description: Internal service address; public requests enter through API Gateway.
x-hhc-service: asset-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/asset-api
tags:
  - name: Operations
    description: Health and readiness checks.
  - name: Public
    description: Gateway-proxied public asset and authorized collection delivery.
  - name: Private
    description: Dapr-authenticated service operations.
paths:
  /health:
    get:
      summary: Asset API operation
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /ready:
    get:
      summary: Asset API operation
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Error' }
  /api/assets/public/{assetID}:
    parameters: [ { $ref: '#/components/parameters/AssetID' } ]
    get:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway is the current application caller. Serves only a clean, public asset version.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '404': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
  /api/assets/public/{assetID}/{variant}:
    parameters: [ { $ref: '#/components/parameters/AssetID' }, { $ref: '#/components/parameters/Variant' } ]
    get:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway is the current application caller. Serves a completed public image derivative.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '404': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
  /api/assets/collections:
    get:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway forwards verified user identity for authorized collection listing.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { $ref: '#/components/responses/ReaderCollectionPage' }
        '401': { $ref: '#/components/responses/Error' }
  /api/assets/collections/{collectionID}/changes:
    parameters: [ { $ref: '#/components/parameters/CollectionID' } ]
    get:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway forwards verified user identity for incremental collection changes.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { $ref: '#/components/responses/ReaderCollectionChanges' }
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/collections/{collectionID}/items/{itemID}:
    parameters: [ { $ref: '#/components/parameters/CollectionID' }, { $ref: '#/components/parameters/ItemID' } ]
    get:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway forwards verified user identity for an authorized collection item.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { $ref: '#/components/responses/ReaderCollectionItem' }
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/collections/{collectionID}/items/{itemID}/content-ticket:
    parameters: [ { $ref: '#/components/parameters/CollectionID' }, { $ref: '#/components/parameters/ItemID' } ]
    post:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway forwards verified user identity and token expiry to issue a short-lived content ticket.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '201': { $ref: '#/components/responses/ContentTicket' }
        '403': { $ref: '#/components/responses/Error' }
  /api/assets/collections/{collectionID}/items/{itemID}/content:
    parameters: [ { $ref: '#/components/parameters/CollectionID' }, { $ref: '#/components/parameters/ItemID' } ]
    get:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway forwards verified user identity to stream authorized content with range support.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '206': { $ref: '#/components/responses/Download' }
        '416': { $ref: '#/components/responses/Error' }
  /api/assets/content:
    get:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway redeems a short-lived content ticket; the ticket is not a user identity.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [] } ]
      parameters: [ { $ref: '#/components/parameters/ContentTicket' } ]
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '206': { $ref: '#/components/responses/Download' }
        '401': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
  /priv/assets/upload-sessions:
    post:
      summary: Asset API operation
      tags: [Private]
      description: The owning service creates an idempotent upload session. The returned short-lived upload target is a response value, never a durable credential.
      x-hhc-visibility: private
      x-hhc-callers: [account-api, hhc-web-api, hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedUpload' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /priv/assets/operations:
    get:
      summary: Asset API operation
      tags: [Private]
      description: Returns scan, processing, and purge backlog counts for current owning services.
      x-hhc-visibility: private
      x-hhc-callers: [account-api, hhc-web-api, hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '200': { $ref: '#/components/responses/Operations' }
  /priv/assets/collections:
    get:
      summary: Asset API operation
      tags: [Private]
      description: LINE media-sync collection management is currently owned by the LINE function bot.
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '200': { $ref: '#/components/responses/ManagedCollectionPage' }
    post:
      summary: Asset API operation
      tags: [Private]
      description: Creates a storage collection; caller-owned business context is not stored here.
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCollectionRequest' }
      responses:
        '201': { $ref: '#/components/responses/Collection' }
  /priv/assets/collections/{collectionID}:
    parameters: [ { $ref: '#/components/parameters/CollectionID' } ]
    get:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '200': { $ref: '#/components/responses/ManagedCollection' }
    patch:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameRequest' }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    delete:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /priv/assets/collections/{collectionID}/items:
    parameters: [ { $ref: '#/components/parameters/CollectionID' } ]
    get:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '200': { $ref: '#/components/responses/ManagedCollectionItemPage' }
    post:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCollectionItemRequest' }
      responses:
        '201': { $ref: '#/components/responses/CollectionItemMutation' }
  /priv/assets/collections/{collectionID}/items/content-tickets:
    parameters: [ { $ref: '#/components/parameters/CollectionID' } ]
    post:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentTicketBatchRequest' }
      responses:
        '201': { $ref: '#/components/responses/ContentTicketBatch' }
  /priv/assets/collections/{collectionID}/items/retention:
    parameters: [ { $ref: '#/components/parameters/CollectionID' } ]
    post:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCollectionItemsRetentionRequest' }
      responses:
        '204': { description: Retention flags updated. }
  /priv/assets/collections/{collectionID}/items/delete:
    parameters: [ { $ref: '#/components/parameters/CollectionID' } ]
    post:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemIDsRequest' }
      responses:
        '200': { $ref: '#/components/responses/DeleteCollectionItems' }
  /priv/assets/collections/{collectionID}/items/{itemID}:
    parameters: [ { $ref: '#/components/parameters/CollectionID' }, { $ref: '#/components/parameters/ItemID' } ]
    patch:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameRequest' }
      responses:
        '200': { $ref: '#/components/responses/ManagedCollectionItem' }
    delete:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { $ref: '#/components/responses/CollectionItemMutation' }
  /priv/assets/collections/{collectionID}/retention:
    parameters: [ { $ref: '#/components/parameters/CollectionID' } ]
    patch:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionRetentionRequest' }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /priv/assets/collections/{collectionID}/acl:
    parameters: [ { $ref: '#/components/parameters/CollectionID' } ]
    post:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionACLRequest' }
      responses:
        '201': { $ref: '#/components/responses/CollectionACLMutation' }
  /priv/assets/collections/{collectionID}/acl/{aclID}:
    parameters: [ { $ref: '#/components/parameters/CollectionID' }, { $ref: '#/components/parameters/ACLID' } ]
    delete:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { $ref: '#/components/responses/CollectionACLMutation' }
  /priv/assets/{assetID}:
    parameters: [ { $ref: '#/components/parameters/AssetID' } ]
    get:
      summary: Asset API operation
      tags: [Private]
      description: Returns lifecycle metadata only to the service that owns the asset namespace.
      x-hhc-visibility: private
      x-hhc-callers: [account-api, hhc-web-api, hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '200': { $ref: '#/components/responses/Asset' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      summary: Asset API operation
      tags: [Private]
      description: Soft-deletes the owner asset and immediately denies future download; retention performs idempotent byte removal.
      x-hhc-visibility: private
      x-hhc-callers: [account-api, hhc-web-api, hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '204': { description: Asset deletion accepted. }
  /priv/assets/{assetID}/download:
    parameters: [ { $ref: '#/components/parameters/AssetID' } ]
    get:
      summary: Asset API operation
      tags: [Private]
      description: Streams an owned, granted, clean asset. Restricted downloads require matching subject headers.
      x-hhc-visibility: private
      x-hhc-callers: [account-api, hhc-web-api, hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '206': { $ref: '#/components/responses/Download' }
        '403': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
  /priv/assets/{assetID}/public-url:
    parameters: [ { $ref: '#/components/parameters/AssetID' } ]
    get:
      summary: Asset API operation
      tags: [Private]
      description: Returns the stable platform download URL, not a Blob or SAS URL.
      x-hhc-visibility: private
      x-hhc-callers: [account-api, hhc-web-api, hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '200': { $ref: '#/components/responses/PublicURL' }
  /priv/assets/{assetID}/complete:
    parameters: [ { $ref: '#/components/parameters/AssetID' } ]
    post:
      summary: Asset API operation
      tags: [Private]
      description: Validates completed upload bytes and queues the scan lifecycle.
      x-hhc-visibility: private
      x-hhc-callers: [account-api, hhc-web-api, hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUploadRequest' }
      responses:
        '200': { $ref: '#/components/responses/Asset' }
        '400': { $ref: '#/components/responses/Error' }
  /priv/assets/{assetID}/grants:
    parameters: [ { $ref: '#/components/parameters/AssetID' } ]
    post:
      summary: Asset API operation
      tags: [Private]
      description: Creates an idempotent subject grant for an owned asset.
      x-hhc-visibility: private
      x-hhc-callers: [account-api, hhc-web-api, hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGrantRequest' }
      responses:
        '201': { $ref: '#/components/responses/Grant' }
  /priv/assets/{assetID}/grants/{grantID}:
    parameters: [ { $ref: '#/components/parameters/AssetID' }, { $ref: '#/components/parameters/GrantID' } ]
    delete:
      summary: Asset API operation
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api, hhc-web-api, hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '204': { description: Grant revoked. }
  /priv/assets/{assetID}/scan/requeue:
    parameters: [ { $ref: '#/components/parameters/AssetID' } ]
    post:
      summary: Asset API operation
      tags: [Private]
      description: Requeues a failed scan for an owned asset; infected assets cannot be requeued.
      x-hhc-visibility: private
      x-hhc-callers: [account-api, hhc-web-api, hhc-line-function-bot]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '202': { description: Scan requeue accepted. }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    daprCaller:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Dapr app-channel token with the authenticated Dapr caller identity.
    workloadPrincipal:
      type: apiKey
      in: header
      name: X-MS-CLIENT-PRINCIPAL
      description: Validated Azure workload principal. The configured LINE workload principal maps to `hhc-line-function-bot`.
    gatewayDaprCaller:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Valid Dapr app-channel token and Dapr-Caller-App-Id exactly `api-gateway`.
    gatewayTrustedIdentity:
      type: apiKey
      in: header
      name: X-HHC-User-ID
      description: Gateway-injected identity. X-HHC-User-ID and X-HHC-Token-Expires-At are required; X-HHC-Roles, X-HHC-Token-ID, X-HHC-Session-ID, and X-HHC-Auth-Provider are optional trusted context.
  parameters:
    AssetID: { name: assetID, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueID' } }
    CollectionID: { name: collectionID, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueID' } }
    ItemID: { name: itemID, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueID' } }
    GrantID: { name: grantID, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueID' } }
    ACLID: { name: aclID, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueID' } }
    Variant: { name: variant, in: path, required: true, schema: { type: string, enum: [small, medium, large] } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    ContentTicket: { name: ticket, in: query, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Health:
      description: Service state.
      content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
    Error:
      description: Stable Asset API error.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Asset:
      description: Asset lifecycle metadata.
      content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
    CreatedUpload:
      description: Idempotent upload session with a short-lived upload target.
      content: { application/json: { schema: { $ref: '#/components/schemas/CreatedUpload' } } }
    Grant:
      description: Asset access grant.
      content: { application/json: { schema: { $ref: '#/components/schemas/Grant' } } }
    PublicURL:
      description: Stable platform download URL.
      content: { application/json: { schema: { $ref: '#/components/schemas/PublicURL' } } }
    Operations:
      description: Scan, processing, and purge work counts.
      content: { application/json: { schema: { $ref: '#/components/schemas/Operations' } } }
    Download:
      description: Asset bytes with ETag and Range support.
      headers:
        ETag: { schema: { type: string } }
        Accept-Ranges: { schema: { type: string, enum: [bytes] } }
      content: { application/octet-stream: { schema: { type: string, format: binary } } }
    Collection: { description: Storage collection metadata., content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
    CollectionPage: { description: Authorized collection page., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionPage' } } } }
    CollectionChanges: { description: Authorized collection change page., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionChanges' } } } }
    CollectionItem: { description: Collection item metadata., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionItem' } } } }
    ReaderCollectionPage: { description: Reader-safe collection page., content: { application/json: { schema: { $ref: '#/components/schemas/ReaderCollectionPage' } } } }
    ReaderCollectionChanges: { description: Reader-safe collection change page., content: { application/json: { schema: { $ref: '#/components/schemas/ReaderCollectionChanges' } } } }
    ReaderCollectionItem: { description: Reader-safe collection item metadata., content: { application/json: { schema: { $ref: '#/components/schemas/ReaderCollectionItem' } } } }
    ContentTicket: { description: Short-lived content ticket., content: { application/json: { schema: { $ref: '#/components/schemas/ContentTicket' } } } }
    ContentTicketBatch: { description: Short-lived managed content tickets., content: { application/json: { schema: { $ref: '#/components/schemas/ContentTicketBatch' } } } }
    ManagedCollection: { description: Managed collection and ACLs., content: { application/json: { schema: { $ref: '#/components/schemas/ManagedCollection' } } } }
    ManagedCollectionPage: { description: Managed collection page., content: { application/json: { schema: { $ref: '#/components/schemas/ManagedCollectionPage' } } } }
    ManagedCollectionItem: { description: Managed collection item., content: { application/json: { schema: { $ref: '#/components/schemas/ManagedCollectionItem' } } } }
    ManagedCollectionItemPage: { description: Managed collection item page., content: { application/json: { schema: { $ref: '#/components/schemas/ManagedCollectionItemPage' } } } }
    CollectionItemMutation: { description: Collection item mutation., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionItemMutation' } } } }
    CollectionACLMutation: { description: Collection ACL mutation., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionACLMutation' } } } }
    DeleteCollectionItems: { description: Collection deletion result., content: { application/json: { schema: { $ref: '#/components/schemas/DeleteCollectionItemsResult' } } } }
  schemas:
