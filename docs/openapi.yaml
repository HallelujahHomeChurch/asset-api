  /priv/recording-sources:
    post:
      operationId: createRecordingSource
      summary: Create or replay a private browser source upload.
      description: Gated source-ingest API, disabled until the source worker is wired. One active source per actor. Only MP4 inputs, at most 50,000,000,000 bytes; 16MiB Azure blocks, including more than 1000 blocks. Does not create ordinary assets or scan jobs.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RecordingActorID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recordingId, fileName, sizeBytes, checksumSHA256]
              properties:
                recordingId: { type: string, pattern: '^[a-zA-Z0-9-]{1,80}$' }
                fileName: { type: string, minLength: 5, maxLength: 255, description: 'MP4 basename; maximum 255 UTF-8 bytes, no separators or control characters.' }
                sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 50000000000 }
                checksumSHA256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      responses:
        '201': { description: Created or exact replay; no byte verification yet., content: { application/json: { schema: { $ref: '#/components/schemas/RecordingSource' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { description: source_too_large, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-sources/{sourceID}:
    parameters: [ { $ref: '#/components/parameters/RecordingSourceID' }, { $ref: '#/components/parameters/RecordingActorID' } ]
    get:
      operationId: getRecordingSource
      summary: Query durable source state and confirmed block numbers for resume.
      description: Confirms exact block sizes, not SHA-256 or media readiness. Traverse nextCursor until zero. Expired or non-uploading sources do not query mutable staging. State finalizing means the browser may close, not that media is playable.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters:
        - { name: cursor, in: query, schema: { type: integer, minimum: 0, maximum: 2981, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200': { description: Source upload and processing state., content: { application/json: { schema: { $ref: '#/components/schemas/RecordingSourceStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-sources/{sourceID}/sign:
    parameters: [ { $ref: '#/components/parameters/RecordingSourceID' }, { $ref: '#/components/parameters/RecordingActorID' } ]
    post:
      operationId: signRecordingSource
      summary: Sign a bounded set of staging block PUT requests.
      description: Returns a single-blob write capability valid at most 15 minutes and no later than session expiry. No read/list/delete permission. The bearer SAS is not a byte quota, browser identity binding, or immutable grant. The worker must isolate and verify the committed input. Responses are no-store and URLs must never be logged.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [numbers]
              properties:
                numbers: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 2981 } }
      responses:
        '200': { description: Signed source block requests., content: { application/json: { schema: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SignedRecordingSourceBlock' } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-sources/{sourceID}/complete:
    parameters: [ { $ref: '#/components/parameters/RecordingSourceID' }, { $ref: '#/components/parameters/RecordingActorID' } ]
    post:
      operationId: completeRecordingSource
      summary: Commit the block list and durably accept source finalization.
      description: Checks bounded block metadata and pins the commit ETag before persisting finalizing. No full source read, hash, copy or encode in this request. 202 permits closing the browser but is not ready/publication. Replays return the original source job without recommitting or extending its seven-day retry window. A subsequent asynchronous verification failure remains visible in source status.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '202': { description: Durable finalization receipt or accepted completion replay., content: { application/json: { schema: { $ref: '#/components/schemas/RecordingSource' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-sources/{sourceID}/ready:
    parameters:
      - { $ref: '#/components/parameters/RecordingSourceID' }
      - { name: recordingId, in: query, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9-]{1,80}$' } }
    get:
      operationId: getReadyRecordingSource
      summary: Resolve the ready output for CMS background reconciliation.
      description: CMS-owner and recording binding are mandatory; no human uploader session is required. Returns only the source/recording/package IDs and ready state, never source bytes or capabilities. Package readiness and expiry must still be checked using the package contract.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '200':
          description: Ready source output projection.
          content:
            application/json:
              schema:
                type: object
                required: [sourceId, recordingId, packageId, state]
                properties:
                  sourceId: { type: string }
                  recordingId: { type: string }
                  packageId: { type: string }
                  state: { type: string, enum: [ready] }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-sources/{sourceID}/retry-processing:
    parameters: [ { $ref: '#/components/parameters/RecordingSourceID' }, { $ref: '#/components/parameters/RecordingActorID' } ]
    post:
      operationId: retryRecordingSource
      summary: Retry a transient source-processing failure within its original budget.
      description: Reuses the verified immutable source when available. Maximum three attempts including crashed executions; no reset of the original seven-day deadline. Invalid media and exhausted/expired work cannot retry. A lost-response replay of queued or active work is a no-op. An actor with another active source cannot enqueue a second source.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '202': { description: Accepted retry or active/ready replay., content: { application/json: { schema: { $ref: '#/components/schemas/RecordingSource' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-packages:
    post:
      operationId: createRecordingPackage
      summary: Create or replay an actor-bound HLS package upload.
      description: Gated producer API; unavailable until wired with the package worker. Inventory is bounded to 8MiB; total package bytes include its canonical serialized bytes. At most two active packages per actor and one package per recording.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RecordingActorID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recordingId, inventory]
              properties:
                recordingId: { type: string, pattern: '^[a-zA-Z0-9-]{1,80}$' }
                inventory: { $ref: '#/components/schemas/RecordingPackageInventory' }
      responses:
        '201': { description: Created or exact replay; not yet ready., content: { application/json: { schema: { $ref: '#/components/schemas/RecordingPackage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { description: 'package_too_large: total package exceeds 10GB.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-packages/{packageID}:
    parameters: [ { $ref: '#/components/parameters/RecordingPackageID' }, { $ref: '#/components/parameters/RecordingActorID' } ]
    get:
      operationId: getRecordingPackage
      summary: Query state and a bounded page of remotely observed upload objects.
      description: confirmedObjects means remote size matches the inventory, not verified SHA-256 or ready media. A strongly consistent R2 listing is scoped to the package staging prefix and bounded to 10000 objects; provider failures never imply missing or confirmed objects. Results follow sorted inventory path order; use nextCursor until empty. Non-uploading states do not query mutable staging objects.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Last examined object path from the previous page. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200': { description: Actor-scoped upload status., content: { application/json: { schema: { $ref: '#/components/schemas/RecordingPackageStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-packages/{packageID}/ready:
    parameters: [ { $ref: '#/components/parameters/RecordingPackageID' } ]
    get:
      operationId: getReadyRecordingPackage
      summary: Read the recording-bound ready package projection for its owning CMS.
      description: Owner-only and gated with HLS. Does not require uploader identity or expose inventory/storage paths. CMS must independently authorize its viewer or publication operation. Failed, incomplete, expired and mismatched packages are denied.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      parameters:
        - { name: recordingId, in: query, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9-]{1,80}$' } }
      responses:
        '200': { description: Bounded ready projection., content: { application/json: { schema: { $ref: '#/components/schemas/RecordingPackageStatus' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-packages/{packageID}/sign:
    parameters: [ { $ref: '#/components/parameters/RecordingPackageID' }, { $ref: '#/components/parameters/RecordingActorID' } ]
    post:
      operationId: signRecordingPackage
      summary: Sign up to 100 fixed-size staging object PUT URLs.
      description: Validates the entire batch before signing. Only inventory paths are accepted. URLs last at most 15 minutes or the remaining upload session, never target final storage and must not be logged. No new URLs after complete.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paths]
              properties:
                paths: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }
      responses:
        '200': { description: Single-object PUT capabilities., content: { application/json: { schema: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SignedRecordingObject' } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-packages/{packageID}/complete:
    parameters: [ { $ref: '#/components/parameters/RecordingPackageID' }, { $ref: '#/components/parameters/RecordingActorID' } ]
    post:
      operationId: completeRecordingPackage
      summary: Durably freeze the inventory and queue asynchronous copy and validation.
      description: Returns only after the freezing state is persisted. An exact replay returns the accepted state, even after the upload session expires. Does not verify all uploaded bytes in the request or make the package ready.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      responses:
        '202': { description: Durable freezing receipt or accepted completion replay., content: { application/json: { schema: { $ref: '#/components/schemas/RecordingPackage' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /priv/recording-packages/{packageID}/grant:
    parameters: [ { $ref: '#/components/parameters/RecordingPackageID' } ]
    post:
      operationId: issueRecordingPackageGrant
      summary: Issue an immutable package-prefix playback exchange after CMS entitlement checks.
      description: Requires a ready CMS-owned package matching recordingId. The owning CMS must check the current viewer entitlement and publication before calling. Media retention and the supplied publication expiry clamp the one-hour playback credential; no mutable staging path is signed. The authenticated playback base optionally serves previews/index.vtt (text/vtt) and previews/seg-NNNNNN.jpg (image/jpeg), each bounded to 1 MiB and authorized identically to HLS including cache hits. WEBVTT cues reference five-second 160x90 sprite cells relative to the index; absent previews return 404 without affecting video readiness. Derived paths are server-only and excluded from producer inventories and PUT signing. See docs/member-video-operations.md for the canonical preview contract.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [ { daprCaller: [] }, { workloadPrincipal: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recordingId, scopeId, recordingExpiresAt]
              properties:
                recordingId: { type: string }
                scopeId: { type: string }
                recordingExpiresAt: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/RecordingGrant' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    daprCaller:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Dapr app-channel token with the authenticated Dapr caller identity.
    workloadPrincipal:
      type: apiKey
      in: header
      name: X-MS-CLIENT-PRINCIPAL
      description: Validated Azure workload principal. The configured LINE workload principal maps to `hhc-line-function-bot`.
    gatewayDaprCaller:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Valid Dapr app-channel token and Dapr-Caller-App-Id exactly `api-gateway`.
    gatewayTrustedIdentity:
      type: apiKey
      in: header
      name: X-HHC-User-ID
      description: Gateway-injected identity. X-HHC-User-ID and X-HHC-Token-Expires-At are required; X-HHC-Role-IDs optionally carries deduplicated immutable Account role UUIDs. X-HHC-Token-ID, X-HHC-Session-ID, and X-HHC-Auth-Provider remain optional trusted context. Reader authorization is active collection ACL only.
  parameters:
    RecordingSourceID: { name: sourceID, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{32}$' } }
    AssetID: { name: assetID, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueID' } }
    CollectionID: { name: collectionID, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueID' } }
    ItemID: { name: itemID, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueID' } }
    GrantID: { name: grantID, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueID' } }
    ACLID: { name: aclID, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueID' } }
    Variant: { name: variant, in: path, required: true, schema: { type: string, enum: [small, medium, large] } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    RecordingActorID: { name: X-HHC-Actor-ID, in: header, required: true, schema: { type: string, format: uuid } }
    RecordingPackageID: { name: packageID, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{32}$' } }
    ACLActorUserID: { name: X-HHC-Actor-ID, in: header, required: true, description: Verified Account manager user UUID recorded in the successful ACL mutation audit event., schema: { type: string, format: uuid } }
    RequestID: { name: X-HHC-Request-ID, in: header, required: true, description: Request correlation ID recorded in the successful ACL mutation audit event., schema: { type: string, minLength: 1 } }
    GrantIdempotencyKey: { name: Idempotency-Key, in: header, required: false, description: Required when body idempotencyKey is absent., schema: { type: string, minLength: 1, maxLength: 128 } }
    AssetSubjectType: { name: X-Asset-Subject-Type, in: header, required: true, schema: { type: string, enum: [user, role, service, line_group, app_client] } }
    AssetSubjectID: { name: X-Asset-Subject-Id, in: header, required: true, schema: { type: string, minLength: 1 } }
    ContentTicket: { name: ticket, in: query, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Health:
      description: Service state.
      content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
    Error:
      description: Stable Asset API error.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Asset:
      description: Asset lifecycle metadata.
      content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
    CreatedUpload:
      description: Idempotent upload session with a short-lived upload target.
      content: { application/json: { schema: { $ref: '#/components/schemas/CreatedUpload' } } }
    RecordingGrant: { description: 'One-minute exchange credential, never a public URL.', content: { application/json: { schema: { $ref: '#/components/schemas/RecordingMediaGrant' } } } }
    Grant:
      description: Asset access grant.
      content: { application/json: { schema: { $ref: '#/components/schemas/Grant' } } }
    PublicURL:
      description: Stable platform download URL.
      content: { application/json: { schema: { $ref: '#/components/schemas/PublicURL' } } }
    Operations:
      description: Scan, processing, purge, and protected-bulletin public-grant reconciliation counts.
      content: { application/json: { schema: { $ref: '#/components/schemas/Operations' } } }
    Download:
      description: Asset bytes with ETag and Range support.
      headers:
        ETag: { schema: { type: string } }
        Accept-Ranges: { schema: { type: string, enum: [bytes] } }
      content: { application/octet-stream: { schema: { type: string, format: binary } } }
    Collection: { description: Storage collection metadata., content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
    CollectionPage: { description: Authorized collection page., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionPage' } } } }
    CollectionChanges: { description: Authorized collection change page., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionChanges' } } } }
    CollectionItem: { description: Collection item metadata., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionItem' } } } }
    ReaderCollectionPage: { description: Reader-safe collection page., content: { application/json: { schema: { $ref: '#/components/schemas/ReaderCollectionPage' } } } }
    ReaderCollectionChanges: { description: Reader-safe collection change page., content: { application/json: { schema: { $ref: '#/components/schemas/ReaderCollectionChanges' } } } }
    ReaderCollectionItem: { description: Reader-safe collection item metadata., content: { application/json: { schema: { $ref: '#/components/schemas/ReaderCollectionItem' } } } }
    ContentTicket: { description: Short-lived content ticket., content: { application/json: { schema: { $ref: '#/components/schemas/ContentTicket' } } } }
    ContentTicketBatch: { description: Short-lived managed content tickets., content: { application/json: { schema: { $ref: '#/components/schemas/ContentTicketBatch' } } } }
    ManagedCollection: { description: Managed collection and ACLs., content: { application/json: { schema: { $ref: '#/components/schemas/ManagedCollection' } } } }
    ManagedCollectionPage: { description: Managed collection page., content: { application/json: { schema: { $ref: '#/components/schemas/ManagedCollectionPage' } } } }
    ManagedCollectionItem: { description: Managed collection item., content: { application/json: { schema: { $ref: '#/components/schemas/ManagedCollectionItem' } } } }
    ManagedCollectionItemPage: { description: Managed collection item page., content: { application/json: { schema: { $ref: '#/components/schemas/ManagedCollectionItemPage' } } } }
    CollectionItemMutation: { description: Collection item mutation., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionItemMutation' } } } }
    CollectionACLMutation: { description: Collection ACL mutation., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionACLMutation' } } } }
    DeleteCollectionItems: { description: Collection deletion result., content: { application/json: { schema: { $ref: '#/components/schemas/DeleteCollectionItemsResult' } } } }
  schemas:
    RecordingSource:
      type: object
      additionalProperties: false
      required: [sourceId, recordingId, fileName, sizeBytes, checksumSHA256, blockCount, state, createdAt, expiresAt]
      properties:
        failureCode: { type: string, enum: [invalid, retry, exhausted] }
        packageId: { type: string, description: Present only after the whole package is verified and ready. }
        sourceId: { type: string, pattern: '^[a-f0-9]{32}$' }
        recordingId: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 50000000000 }
        checksumSHA256: { type: string, pattern: '^[a-f0-9]{64}$' }
        blockCount: { type: integer, minimum: 1, maximum: 2981 }
        state: { type: string, enum: [uploading, finalizing, queued, processing, ready, failed, expired] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 'Original upload session deadline, not the processing deadline.' }
        completedAt: { type: string, format: date-time }
        retryUntil: { type: string, format: date-time, description: 'First durable completion plus seven days, never extended by retry.' }
    RecordingSourceStatus:
      type: object
      additionalProperties: false
      required: [sourceId, recordingId, fileName, sizeBytes, checksumSHA256, blockCount, state, createdAt, expiresAt, confirmedBlocks, nextCursor]
      properties:
        failureCode: { type: string, enum: [invalid, retry, exhausted] }
        packageId: { type: string, description: Present only after the whole package is verified and ready. }
        sourceId: { type: string, pattern: '^[a-f0-9]{32}$' }
        recordingId: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 50000000000 }
        checksumSHA256: { type: string, pattern: '^[a-f0-9]{64}$' }
        blockCount: { type: integer, minimum: 1, maximum: 2981 }
        state: { type: string, enum: [uploading, finalizing, queued, processing, ready, failed, expired] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        retryUntil: { type: string, format: date-time }
        confirmedBlocks: { type: array, maxItems: 1000, items: { type: integer, minimum: 1, maximum: 2981 } }
        nextCursor: { type: integer, minimum: 0, maximum: 2981, description: Last returned block number; zero when this pass is complete. }
    SignedRecordingSourceBlock:
      type: object
      additionalProperties: false
      required: [number, url, method, headers, expiresAt]
      properties:
        number: { type: integer, minimum: 1, maximum: 2981 }
        url: { type: string, format: uri }
        method: { type: string, const: PUT }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string, format: date-time }
    RecordingPackage:
      type: object
      additionalProperties: false
      required: [packageId, sessionId, recordingId, state, sizeBytes, createdAt, expiresAt, inventory]
      properties:
        packageId: { type: string }
        sessionId: { type: string, description: Same identifier as packageId; one immutable inventory per upload session. }
        recordingId: { type: string }
        state: { type: string, enum: [uploading, freezing, validating, ready, failed, expired] }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 10000000000 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Upload session expiry; not the ready media retention deadline. }
        inventory: { $ref: '#/components/schemas/RecordingPackageInventory' }
        readyAt: { type: string, format: date-time }
        mediaExpiresAt: { type: string, format: date-time, description: First ready time plus thirty days; distinct from upload expiry. }
    RecordingPackageStatus:
      type: object
      additionalProperties: false
      required: [packageId, sessionId, recordingId, state, sizeBytes, expiresAt, confirmedObjects, nextCursor]
      properties:
        packageId: { type: string }
        sessionId: { type: string }
        recordingId: { type: string }
        state: { type: string, enum: [uploading, freezing, validating, ready, failed, expired] }
        sizeBytes: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        confirmedObjects: { type: array, maxItems: 1000, items: { type: string } }
        nextCursor: { type: string, description: Last examined path; empty when this pass is complete. }
        readyAt: { type: string, format: date-time }
        mediaExpiresAt: { type: string, format: date-time }
        renditions: { type: array, minItems: 1, maxItems: 2, items: { $ref: '#/components/schemas/RecordingRendition' } }
    SignedRecordingObject:
      allOf:
        - { $ref: '#/components/schemas/RecordingPartTarget' }
        - type: object
          required: [path]
          properties:
            path: { type: string }
    RecordingPackageInventory:
      type: object
      additionalProperties: false
      description: >-
        HLS v1 declared inventory for the gated package upload contract; current MP4 routes do not consume it.
        SHA-256 inventoryDigest hashes UTF-8 encoding/json-compatible serialization with this field omitted,
        objects sorted by path, renditions sorted by name, and fields in the order shown below.
        Objects exclude package.json itself; total package bytes include the serialized inventory.
        Metadata and hashes are declarations, not proof of readiness. Final bytes and media are verified by the recording Job.
        Master BANDWIDTH and optional AVERAGE-BANDWIDTH must match measured media segment bytes and EXTINF durations
        under RFC 8216 section 4.1, not configured encoder bitrates. Ineligible short-tail windows are excluded from peak bandwidth.
      required: [schemaVersion, presetVersion, objects, renditions, inventoryDigest]
      properties:
        schemaVersion: { type: integer, const: 1 }
        presetVersion: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$' }
        objects:
          type: array
          minItems: 4
          maxItems: 10000
          items: { $ref: '#/components/schemas/RecordingPackageObject' }
        renditions:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/RecordingRendition' }
        inventoryDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
    RecordingPackageObject:
      type: object
      additionalProperties: false
      required: [path, sizeBytes, sha256]
      properties:
        path:
          type: string
          pattern: '^(master\.m3u8|(720p|1080p)/(index\.m3u8|init\.mp4|seg-[0-9]{6}\.m4s))$'
          description: Canonical relative path. Unique paths and every declared rendition's complete contiguous segment list are required. No URLs, encoded paths, queries or package.json.
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 134217728, description: 'Playlists additionally have a 1048576-byte limit. Package total including inventory must be at most 10000000000 bytes.' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    RecordingRendition:
      type: object
      additionalProperties: false
      required: [name, width, height, frameRate, videoBitrate, audioBitrate, durationSeconds, segmentCount]
      properties:
        name: { type: string, enum: [720p, 1080p], description: '720p is mandatory; 1080p optional. Names are unique.' }
        width: { type: integer, minimum: 2, maximum: 1920, multipleOf: 2, description: '720p maximum width is 1280; source must never be upscaled.' }
        height: { type: integer, minimum: 2, maximum: 1080, multipleOf: 2, description: '720p maximum height is 720. Actual dimensions are retained for smaller sources.' }
        frameRate: { type: number, exclusiveMinimum: 0, maximum: 30 }
        videoBitrate: { type: integer, minimum: 500000, maximum: 8000000 }
        audioBitrate: { type: integer, const: 128000 }
        durationSeconds: { type: number, exclusiveMinimum: 0, maximum: 43200 }
        segmentCount: { type: integer, minimum: 1, maximum: 1440, description: 'ceil(durationSeconds/30); both renditions require aligned actual boundaries.' }
    RecordingPartTarget:
      type: object
      required: [url, method, headers]
      properties:
        url: { type: string, format: uri }
        method: { type: string, const: PUT }
        headers: { type: object, additionalProperties: { type: array, items: { type: string } } }
    RecordingMediaGrant:
      type: object
      required: [exchangeCredential, expiresAt]
      properties:
        exchangeCredential: { type: string, description: 'One-minute body-only bearer, never logged.' }
        expiresAt: { type: string, format: date-time }
    AccountCleanupRequest:
      type: object
      additionalProperties: false
      required: [userId, idempotencyKey]
      properties:
        userId: { type: string, format: uuid }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
    AccountCleanupResult:
      type: object
      additionalProperties: false
      required: [status, affectedCount, remainingCount, reasonCodes]
      properties:
        status: { type: string, enum: [pending, completed] }
        affectedCount: { type: integer, format: int64, minimum: 0 }
        remainingCount: { type: integer, format: int64, minimum: 0 }
        reasonCodes: { type: array, items: { type: string } }
    CreatePersonalFolderGrant:
      type: object
      additionalProperties: false
      required: [granteeUserId]
      properties: { granteeUserId: { type: string, minLength: 1, maxLength: 128 } }
    PersonalFolderGrant:
      type: object
      required: [id, folderItemId, ownerUserId, granteeUserId, createdAt]
      properties:
        id: { type: string }
        folderItemId: { type: string }
        ownerUserId: { type: string }
        granteeUserId: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    SharedFolderRoot:
      type: object
      required: [grantId, ownerUserId, root, collectionRevision]
      properties:
        grantId: { type: string }
        ownerUserId: { type: string }
        root: { $ref: '#/components/schemas/PersonalNode' }
        collectionRevision: { type: integer, format: int64 }
    SharedFolderSnapshot:
      type: object
      required: [grantId, collectionRevision, items, nextCursor, hasMore, reset]
      properties:
        grantId: { type: string }
        collectionRevision: { type: integer, format: int64 }
        items: { type: array, items: { $ref: '#/components/schemas/PersonalNode' } }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        reset: { type: boolean, const: true }
    PersonalUploadInput:
      type: object
      additionalProperties: false
      required: [fileName, mimeType, sizeBytes]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 1024 }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 209715200 }
    PersonalUploadState:
      type: object
      required: [id, contentPath, expiresAt, uploadStatus, scanStatus, processingStatus]
      properties:
        id: { type: string }
        contentPath: { type: string }
        expiresAt: { type: string, format: date-time }
        uploadStatus: { type: string, enum: [created, completed, failed] }
        scanStatus: { type: string, enum: [pending, clean, infected, failed] }
        processingStatus: { type: string, enum: [pending, ready, not_required, failed] }
    PersonalSpace:
      type: object
      required: [id, revision, usedBytes, quotaBytes]
      properties:
        id: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        usedBytes: { type: integer, format: int64, minimum: 0 }
        quotaBytes: { type: integer, format: int64, minimum: 1 }
    PersonalUsage:
      type: object
      required: [activeBytes, trashBytes, protectedBytes, usedBytes, quotaBytes, overrideBytes]
      properties:
        activeBytes: { type: integer, format: int64, minimum: 0 }
