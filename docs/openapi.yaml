        checksumSha256: { type: string, description: SHA-256 checksum of completed bytes. }
        etag: { type: string }
        uploadStatus: { type: string, enum: [created, completed, failed] }
        scanStatus: { type: string, enum: [pending, clean, infected, failed] }
        scanDetails: { type: string }
        scanSignatureVersion: { type: string }
        scanFailureCategory: { type: string }
        processingStatus: { type: string, enum: [pending, ready, not_required, failed] }
        visibility: { type: string, enum: [public, authenticated, restricted, private] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
