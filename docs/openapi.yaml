        assetId: { $ref: '#/components/schemas/OpaqueID' }
        maxSizeBytes: { type: integer, format: int64 }
        status: { type: string, enum: [created, completed, failed] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    UploadTarget:
      type: object
      required: [url, method, headers, expiresAt]
      properties:
        url: { type: string, format: uri, description: Short-lived SAS or local development upload URL returned only for the upload session. }
