openapi: 3.1.0
info:
  title: HHC Asset API
  version: 1.0.0
  description: >-
    Asset owns bytes, upload validation, scanning, derivatives, grants, downloads, and deletion lifecycle. CMS business records remain owned by the caller. Migration 015 expands reader tickets with UUID role IDs while retaining the legacy role-name field only for pre-015 runtime SQL compatibility; legacy values are never copied or dual-read for authorization, new writes keep them empty, and a later contract migration removes the field.
servers:
  - url: http://asset-api
    description: Internal service address; public requests enter through API Gateway.
x-hhc-service: asset-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/asset-api
tags:
  - name: Operations
    description: Health and readiness checks.
  - name: Public
    description: Gateway-proxied public asset and authorized collection delivery.
  - name: Private
    description: Dapr-authenticated service operations.
paths:
  /health:
    get:
      summary: Asset API operation
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /ready:
    get:
      summary: Asset API operation
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Error' }
  /api/assets/public/{assetID}:
    parameters: [ { $ref: '#/components/parameters/AssetID' } ]
    get:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway is the current application caller. Serves only a clean, public asset version.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '404': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
  /api/assets/public/{assetID}/{variant}:
    parameters: [ { $ref: '#/components/parameters/AssetID' }, { $ref: '#/components/parameters/Variant' } ]
    get:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway is the current application caller. Serves a completed public image derivative.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '404': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space:
    post:
      operationId: ensurePersonalSpace
      summary: Ensure the authenticated user's personal cloud space
      tags: [Public]
      description: Requires presenter:cloud:manage in gateway-verified X-HHC-Scopes for every personal-space route; presenter:cloud:use remains temporarily accepted for compatibility. Creates or returns one permanent personal collection using the trusted gateway user identity. No owner or namespace is accepted from the request body.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200':
          description: Personal collection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalSpace' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/changes:
    get:
      operationId: personalChanges
      summary: Replay owner-scoped immutable personal changes
      tags: [Public]
      description: Each cursor binds the collection and a fixed high-water revision. Reset pages return the latest snapshot for every item at that revision, including tombstones. Clients must preserve dirty local nodes when resetting and commit each page with its cursor atomically.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Fixed-revision snapshot or incremental page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalChangePage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/mutations:
    post:
      operationId: personalMutation
      summary: Commit an atomic personal directory mutation
      tags: [Public]
      description: Locks one owner collection and atomically writes the node, immutable changes and operation receipt. Non-create operations require expectedRevision; folder delete and restore also require expectedCollectionRevision. Restore optionally accepts name to resolve a name collision atomically with the subtree restoration. File mutations only accept an owner-matching completed, clean upload. A 409 with code asset-not-ready is retryable processing state, not a content conflict. Reusing operationId with different content returns 409.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalMutation' }
      responses:
        '200':
          description: Original committed result, including on an identical retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalMutationResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/usage:
    get:
      operationId: personalUsage
      summary: Read authoritative personal cloud usage
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { description: Owner-scoped usage., content: { application/json: { schema: { $ref: '#/components/schemas/PersonalUsage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/trash/purge:
    post:
      operationId: purgePersonalTrash
      summary: Permanently purge selected or all personal cloud trash
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PersonalTrashPurgeInput' } } }
      responses:
        '200': { description: Idempotent purge result., content: { application/json: { schema: { $ref: '#/components/schemas/PersonalTrashPurgeResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/assets/admin/presenter-cloud/users/{userID}/quota:
    parameters:
      - name: userID
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      operationId: adminPersonalQuota
      summary: Read one account's personal cloud quota and usage
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { description: Authoritative usage and effective quota., content: { application/json: { schema: { $ref: '#/components/schemas/PersonalUsage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      operationId: setAdminPersonalQuota
      summary: Set or clear one account's personal cloud quota override
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PersonalQuotaUpdate' } } }
      responses:
        '200': { description: Updated usage and effective quota., content: { application/json: { schema: { $ref: '#/components/schemas/PersonalUsage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/uploads:
    post:
      operationId: createPersonalUpload
      summary: Create an immutable personal upload
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      description: Maximum 200 MiB. Idempotency-Key is scoped to the verified owner. Returns only a same-origin content path; no Blob credentials are exposed.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalUploadInput' }
      responses:
        '201':
          description: Owner-scoped upload state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalUploadState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/uploads/{uploadID}:
    get:
      operationId: personalUploadStatus
      summary: Read owner-scoped upload and scanning status
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      parameters:
        - name: uploadID
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Owner-scoped upload state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalUploadState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/uploads/{uploadID}/content:
    put:
      operationId: putPersonalUpload
      summary: Stream private staging bytes once
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      description: Streams up to 200 MiB with a five-minute deadline. A second write returns 409; query upload status and complete using the original checksum after an uncertain response. Expired uploads require a new upload ID.
      parameters:
        - name: uploadID
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Bytes stored without replacing prior content. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/uploads/{uploadID}/complete:
    post:
      operationId: completePersonalUpload
      summary: Validate and seal an owner-scoped upload
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      parameters:
        - name: uploadID
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUploadRequest' }
      responses:
        '200':
          description: Owner-scoped upload state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalUploadState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/items/{itemID}/content:
    get:
      operationId: personalContent
      summary: Download the current or a specified personal revision
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      description: Owner identity is always required. Downloads acquire a ten-minute purge exclusion lease and finish within five minutes. Missing, expired, unscanned and other-owner content returns 404.
      parameters:
        - name: itemID
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: revision
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '206': { $ref: '#/components/responses/Download' }
        '416': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/items/{itemID}/shares:
    parameters: [ { $ref: '#/components/parameters/ItemID' } ]
    get:
      operationId: listPersonalFolderShares
      summary: List direct active shares for an owned folder
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { description: Active direct grants., content: { application/json: { schema: { type: object, required: [shares], properties: { shares: { type: array, items: { $ref: '#/components/schemas/PersonalFolderGrant' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createPersonalFolderShare
      summary: Share an owned non-root folder read-only
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePersonalFolderGrant' } } } }
      responses:
        '201': { description: New or existing active grant., content: { application/json: { schema: { $ref: '#/components/schemas/PersonalFolderGrant' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/assets/personal-space/items/{itemID}/shares/{grantID}:
    delete:
      operationId: revokePersonalFolderShare
      summary: Revoke one owned folder grant idempotently
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      parameters: [ { $ref: '#/components/parameters/ItemID' }, { $ref: '#/components/parameters/GrantID' } ]
      responses:
        '204': { description: Revoked or already revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/shared-folders:
    get:
      operationId: listSharedFolders
      summary: List highest effective read-only shared roots
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { description: Effective shared roots., content: { application/json: { schema: { type: object, required: [folders], properties: { folders: { type: array, items: { $ref: '#/components/schemas/SharedFolderRoot' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/assets/shared-folders/{grantID}/snapshot:
    get:
      operationId: sharedFolderSnapshot
      summary: Read a fixed-revision reset snapshot of one shared subtree
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GrantID' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Paged current subtree reset., content: { application/json: { schema: { $ref: '#/components/schemas/SharedFolderSnapshot' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/shared-folders/{grantID}/items/{itemID}/content:
    get:
      operationId: sharedFolderContent
      summary: Download current live content through one active grant
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      parameters: [ { $ref: '#/components/parameters/GrantID' }, { $ref: '#/components/parameters/ItemID' } ]
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '206': { $ref: '#/components/responses/Download' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
  /api/assets/shared-folders/{grantID}:
    delete:
      operationId: leaveSharedFolder
      summary: Leave one exact shared-folder grant idempotently
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      parameters: [ { $ref: '#/components/parameters/GrantID' } ]
      responses:
        '204': { description: Left or already left. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/collections:
    get:
      summary: Asset API operation
      tags: [Public]
      description: Returns collections with an active ACL matching the verified user UUID or an immutable role UUID. A user with no matching ACL receives 200 with an empty collections array.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { $ref: '#/components/responses/ReaderCollectionPage' }
        '401': { $ref: '#/components/responses/Error' }
  /api/assets/sync-receipts:
    post:
      summary: Record Presenter sync completion
      tags: [Public]
      description: Records privacy-bounded operational telemetry only after an authorized collection item is available offline. The server receipt time is authoritative; no user, filename, path, meeting, or body data is retained.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncReceipt' }
      responses:
        '204': { description: Receipt recorded. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/collections/{collectionID}/changes:
    parameters: [ { $ref: '#/components/parameters/CollectionID' } ]
    get:
      summary: Asset API operation
      tags: [Public]
      description: Returns incremental changes only when an active collection ACL matches the verified user or role UUID. Missing and unauthorized collections both return 404.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { $ref: '#/components/responses/ReaderCollectionChanges' }
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/collections/{collectionID}/items/{itemID}:
    parameters: [ { $ref: '#/components/parameters/CollectionID' }, { $ref: '#/components/parameters/ItemID' } ]
    get:
      summary: Asset API operation
      tags: [Public]
      description: Returns item metadata only when an active collection ACL matches the verified user or role UUID. Missing and unauthorized collections or items all return 404.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { $ref: '#/components/responses/ReaderCollectionItem' }
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/collections/{collectionID}/items/{itemID}/content-ticket:
    parameters: [ { $ref: '#/components/parameters/CollectionID' }, { $ref: '#/components/parameters/ItemID' } ]
    post:
      summary: Asset API operation
      tags: [Public]
      description: Issues a reader ticket only when an active collection ACL matches the verified user or role UUID. The ticket expires within five minutes and no later than the source access token; missing and unauthorized resources both return 404.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '201': { $ref: '#/components/responses/ContentTicket' }
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/collections/{collectionID}/items/{itemID}/content:
    parameters: [ { $ref: '#/components/parameters/CollectionID' }, { $ref: '#/components/parameters/ItemID' } ]
    get:
      summary: Asset API operation
      tags: [Public]
      description: Streams content only when an active collection ACL matches the verified user or role UUID. Missing and unauthorized resources both return 404.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [], gatewayTrustedIdentity: [] } ]
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '206': { $ref: '#/components/responses/Download' }
        '404': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
  /api/assets/content:
    get:
      summary: Asset API operation
      tags: [Public]
      description: API Gateway redeems a short-lived content ticket; the ticket is not a user identity.
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: [ { gatewayDaprCaller: [] } ]
      parameters: [ { $ref: '#/components/parameters/ContentTicket' } ]
      responses:
        '200': { $ref: '#/components/responses/Download' }
        '206': { $ref: '#/components/responses/Download' }
        '401': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
  /priv/account-cleanup:
    post:
      operationId: cleanupAccountAssets
      summary: Delete every Account-owned asset attributed to one Account user
      tags: [Private]
