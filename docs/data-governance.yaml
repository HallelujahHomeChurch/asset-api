schema_version: 1
service: asset-api
datasets:
  - id: asset.recording-retention-policy
    owner: asset-api
    purpose: Preserve authoritative retention configuration and confirmed administrator change receipts.
    necessity: required
    storage: {kind: postgres, resource: recording_retention_policy, sources: [{path: internal/postgres/recording_retention.go, symbol: RecordingPackageStore.GetRetentionPolicy}]}
    subject_keys: []
    data_classes: [security, activity, identity]
    fields:
      - {name: recording_retention_policy.singleton, purpose: Identify the sole policy, necessity: required, data_classes: [activity]}
      - {name: recording_retention_policy.retention_days, purpose: Control media byte retention, necessity: required, data_classes: [activity]}
      - {name: recording_retention_policy.revision, purpose: Fence stale mutations, necessity: required, data_classes: [activity]}
      - {name: recording_retention_policy.activated_at, purpose: Preserve safe producer-first rollout, necessity: required, data_classes: [activity]}
    attribution: {mode: manual, explanation: Administrator provenance is distinct from video participants and viewer receipts.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-retention-previews
    owner: asset-api
    purpose: Preserve authoritative retention configuration and confirmed administrator change receipts.
    necessity: required
    storage: {kind: postgres, resource: recording_retention_previews, sources: [{path: internal/postgres/recording_retention.go, symbol: RecordingPackageStore.PreviewRetentionPolicy}]}
    subject_keys: []
    data_classes: [security, activity, identity]
    fields:
      - {name: recording_retention_previews.id, purpose: Bind explicit confirmation, necessity: required, data_classes: [activity]}
      - {name: recording_retention_previews.actor_id, purpose: Bind the preview and replay to the authorized administrator, necessity: required, data_classes: [identity]}
      - {name: recording_retention_previews.retention_days, purpose: Bind the proposed days, necessity: required, data_classes: [activity]}
      - {name: recording_retention_previews.revision, purpose: Prevent stale confirmation, necessity: required, data_classes: [activity]}
      - {name: recording_retention_previews.evaluated_at, purpose: Bound preview validity to five minutes, necessity: required, data_classes: [activity]}
      - {name: recording_retention_previews.affected_count, purpose: Record estimated impact, necessity: required, data_classes: [activity]}
      - {name: recording_retention_previews.affected_bytes, purpose: Record estimated storage impact, necessity: required, data_classes: [activity]}
      - {name: recording_retention_previews.idempotency_key, purpose: Recover a confirmed policy change, necessity: required, data_classes: [activity]}
      - {name: recording_retention_previews.result, purpose: Replay the original accepted policy, necessity: required, data_classes: [activity]}
    attribution: {mode: manual, explanation: Administrator provenance is distinct from video participants and viewer receipts.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-covers
    owner: asset-api
    purpose: Preserve recording image processing and retention receipts separately from disposable R2 image bytes.
    necessity: required
    storage: {kind: postgres, resource: recording_covers, sources: [{path: internal/postgres/recording_cover.go, symbol: RecordingCoverStore.Create}]}
    subject_keys: []
    data_classes: [identity, security, content, activity]
    fields:
      - {name: recording_covers.id, purpose: Identify the bounded image job, necessity: required, data_classes: [identity]}
      - {name: recording_covers.package_id, purpose: Bind images to an immutable package, necessity: required, data_classes: [identity]}
      - {name: recording_covers.recording_id, purpose: Enforce recording ownership, necessity: required, data_classes: [identity]}
      - {name: recording_covers.actor_id, purpose: Bind uploader authorization, necessity: required, data_classes: [identity]}
      - {name: recording_covers.idempotency_key, purpose: Recover accepted uploads, necessity: required, data_classes: [security]}
      - {name: recording_covers.kind, purpose: Distinguish auto and custom image processing, necessity: required, data_classes: [content]}
      - {name: recording_covers.mime, purpose: Select the safe image decoder, necessity: required, data_classes: [content]}
      - {name: recording_covers.digest, purpose: Verify immutable input integrity, necessity: required, data_classes: [security]}
      - {name: recording_covers.state, purpose: Fence serving and cleanup, necessity: required, data_classes: [activity]}
      - {name: recording_covers.attempts, purpose: Bound processing retries, necessity: required, data_classes: [activity]}
      - {name: recording_covers.claim_id, purpose: Fence worker completion, necessity: required, data_classes: [security]}
      - {name: recording_covers.claimed_until, purpose: Recover abandoned workers, necessity: required, data_classes: [activity]}
      - {name: recording_covers.output_attempt, purpose: Locate accepted immutable output, necessity: required, data_classes: [security]}
      - {name: recording_covers.created_at, purpose: Bound unselected input retention, necessity: required, data_classes: [activity]}
      - {name: recording_covers.expires_at, purpose: Align image lifetime with video, necessity: required, data_classes: [activity]}
      - {name: recording_covers.next_attempt_at, purpose: Bound retry frequency, necessity: required, data_classes: [activity]}
      - {name: recording_covers.cleanup_after, purpose: Bound reconciliation frequency, necessity: required, data_classes: [activity]}
    attribution: {mode: manual, explanation: CMS owns administrator provenance; recording images may contain people other than the uploader.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-cover-attempts
    owner: asset-api
    purpose: Preserve recording image processing and retention receipts separately from disposable R2 image bytes.
    necessity: required
    storage: {kind: postgres, resource: recording_cover_attempts, sources: [{path: internal/postgres/recording_cover.go, symbol: RecordingCoverStore.Claim}]}
    subject_keys: []
    data_classes: [identity, security, content, activity]
    fields:
      - {name: recording_cover_attempts.claim_id, purpose: Locate attempt specific output, necessity: required, data_classes: [security]}
      - {name: recording_cover_attempts.cover_id, purpose: Bind attempt to image lifecycle, necessity: required, data_classes: [identity]}
      - {name: recording_cover_attempts.created_at, purpose: Bound late writer grace period, necessity: required, data_classes: [activity]}
    attribution: {mode: manual, explanation: CMS owns administrator provenance; recording images may contain people other than the uploader.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-cover-references
    owner: asset-api
    purpose: Preserve recording image processing and retention receipts separately from disposable R2 image bytes.
    necessity: required
    storage: {kind: postgres, resource: recording_cover_references, sources: [{path: internal/postgres/recording_cover.go, symbol: RecordingCoverStore.Retain}]}
    subject_keys: []
    data_classes: [identity, security, content, activity]
    fields:
      - {name: recording_cover_references.reference_id, purpose: Recover selection retention commands, necessity: required, data_classes: [security]}
      - {name: recording_cover_references.cover_id, purpose: Protect selected image output, necessity: required, data_classes: [identity]}
      - {name: recording_cover_references.created_at, purpose: Record selection retention time, necessity: required, data_classes: [activity]}
      - {name: recording_cover_references.released_at, purpose: Fence delayed retain commands after release, necessity: required, data_classes: [security]}
    attribution: {mode: manual, explanation: CMS owns administrator provenance; recording images may contain people other than the uploader.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-deletions
    owner: asset-api
    purpose: Fence late uploads and preserve retryable owner deletion commands.
    necessity: required
    storage: {kind: postgres, resource: recording_deletions, sources: [{path: internal/postgres/recording_deletion.go, symbol: RecordingDeletionStore.DeleteRecording}]}
    subject_keys: []
    data_classes: [identity, security, activity]
    fields:
      - {name: recording_deletions.recording_id, purpose: Prevent recreation of deleted media, necessity: required, data_classes: [identity, security]}
      - {name: recording_deletions.requested_at, purpose: Anchor the immutable deletion receipt, necessity: required, data_classes: [activity]}
    attribution: {mode: manual, explanation: CMS owns the recording and administrator provenance; this receipt contains no viewer identity.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-captures
    owner: asset-api
    purpose: Preserve progressive recording intake and retry evidence under CMS ownership.
    necessity: required
    storage: {kind: postgres, resource: recording_captures, sources: [{path: internal/postgres/recording_capture.go, symbol: RecordingCaptureStore.UpdateCapture}]}
    subject_keys: []
    data_classes: [identity, content, security, activity]
    fields:
      - {"name": "recording_captures.id", "purpose": "Identify capture and staging scope", "necessity": "required", "data_classes": ["identity"]}
      - {"name": "recording_captures.actor_id", "purpose": "Bind capture to the CMS authorized human uploader", "necessity": "required", "data_classes": ["identity", "security"]}
      - {"name": "recording_captures.recording_id", "purpose": "Link intake to the CMS recording", "necessity": "required", "data_classes": ["identity"]}
      - {"name": "recording_captures.create_key", "purpose": "Replay capture creation without duplicate storage", "necessity": "required", "data_classes": ["security"]}
      - {"name": "recording_captures.state", "purpose": "Track intake and validation lifecycle", "necessity": "required", "data_classes": ["activity"]}
      - {"name": "recording_captures.created_at", "purpose": "Anchor original capture lifetime", "necessity": "required", "data_classes": ["activity"]}
      - {"name": "recording_captures.expires_at", "purpose": "Bound writes and unfinished capture processing", "necessity": "required", "data_classes": ["activity"]}
      - {"name": "recording_captures.declared_bytes", "purpose": "Enforce the cumulative byte quota", "necessity": "required", "data_classes": ["content"]}
      - {"name": "recording_captures.declared_objects", "purpose": "Enforce the object count quota", "necessity": "required", "data_classes": ["content"]}
      - {"name": "recording_captures.receipts", "purpose": "Persist immutable operation acceptance and request digests", "necessity": "required", "data_classes": ["security", "activity"]}
      - {"name": "recording_captures.package_id", "purpose": "Link the sealed immutable validation package", "necessity": "required", "data_classes": ["identity"]}
      - {"name": "recording_captures.inventory", "purpose": "Retain normal closure metadata and full hash graph", "necessity": "required", "data_classes": ["content", "security"]}
      - {"name": "recording_captures.terminal_at", "purpose": "Preserve first terminal transition time", "necessity": "required", "data_classes": ["activity"]}
      - {"name": "recording_captures.terminal_reason", "purpose": "Expose a bounded terminal reason without provider secrets", "necessity": "required", "data_classes": ["activity"]}
      - {"name": "recording_captures.cleanup_after", "purpose": "Retry and repeat declared staging key sweeps", "necessity": "required", "data_classes": ["activity"]}
    attribution: {mode: manual, explanation: CMS verifies the human uploader UUID; declarations do not identify video participants or viewers.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-capture-objects
    owner: asset-api
    purpose: Preserve progressive recording intake and retry evidence under CMS ownership.
    necessity: required
    storage: {kind: postgres, resource: recording_capture_objects, sources: [{path: internal/postgres/recording_capture.go, symbol: RecordingCaptureStore.UpdateCapture}]}
    subject_keys: []
    data_classes: [identity, content, security, activity]
    fields:
      - {"name": "recording_capture_objects.capture_id", "purpose": "Bind each declaration to the owning capture", "necessity": "required", "data_classes": ["identity", "security"]}
      - {"name": "recording_capture_objects.path", "purpose": "Identify the declared relative HLS object", "necessity": "required", "data_classes": ["content"]}
      - {"name": "recording_capture_objects.size_bytes", "purpose": "Enforce object and package byte budgets", "necessity": "required", "data_classes": ["content"]}
      - {"name": "recording_capture_objects.sha256", "purpose": "Verify immutable content integrity before readiness", "necessity": "required", "data_classes": ["security"]}
      - {"name": "recording_capture_objects.state", "purpose": "Durably queue validation without claiming media readiness", "necessity": "required", "data_classes": ["activity"]}
    attribution: {mode: manual, explanation: CMS verifies the human uploader UUID; declarations do not identify video participants or viewers.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-sources
    owner: asset-api
    purpose: Bind temporary browser recording inputs to authorized CMS actors and retain fenced processing and retry receipts without entering the ordinary asset scan pipeline.
    necessity: required
    storage: {kind: postgres, resource: recording_sources, sources: [{path: internal/postgres/recording_source.go, symbol: RecordingSourceStore.Create}]}
    subject_keys: []
    data_classes: [identity, content, security, activity]
    fields:
      - {name: recording_sources.id, purpose: Scope the temporary source bytes, necessity: required, data_classes: [identity]}
      - {name: recording_sources.owner_service, purpose: Enforce CMS ownership, necessity: required, data_classes: [security]}
      - {name: recording_sources.actor_id, purpose: Bind authorization and active source quota to the uploader, necessity: required, data_classes: [identity, security]}
      - {name: recording_sources.recording_id, purpose: Link to the CMS recording, necessity: required, data_classes: [identity]}
      - {name: recording_sources.idempotency_key, purpose: Recover lost upload responses, necessity: required, data_classes: [security]}
      - {name: recording_sources.file_name, purpose: Identify the selected input for resume, necessity: required, data_classes: [content]}
      - {name: recording_sources.size_bytes, purpose: Enforce the independent source budget, necessity: required, data_classes: [content]}
      - {name: recording_sources.checksum_sha256, purpose: Verify immutable source integrity, necessity: required, data_classes: [security]}
      - {name: recording_sources.block_count, purpose: Require complete bounded block closure, necessity: required, data_classes: [content]}
      - {name: recording_sources.state, purpose: Report durable processing progress, necessity: required, data_classes: [activity]}
      - {name: recording_sources.processing_progress, purpose: Expose capability-free fenced processing counters and timestamps without changing source retention, necessity: required, data_classes: [activity]}
      - {name: recording_sources.created_at, purpose: Anchor upload lifetime, necessity: required, data_classes: [activity]}
      - {name: recording_sources.expires_at, purpose: Bound upload capabilities, necessity: required, data_classes: [activity]}
      - {name: recording_sources.completed_at, purpose: Persist durable acceptance, necessity: required, data_classes: [activity]}
      - {name: recording_sources.retry_until, purpose: Bound retry retention from first acceptance, necessity: required, data_classes: [activity]}
      - {name: recording_sources.staging_etag, purpose: Fence immutable source copy, necessity: required, data_classes: [security]}
      - {name: recording_sources.processing_attempts, purpose: Bound retry and crash recovery attempts, necessity: required, data_classes: [activity]}
      - {name: recording_sources.claim_id, purpose: Fence worker ownership, necessity: required, data_classes: [security]}
      - {name: recording_sources.claimed_until, purpose: Reclaim abandoned processing, necessity: required, data_classes: [activity]}
      - {name: recording_sources.copy_attempt_id, purpose: Recover the original provider copy, necessity: required, data_classes: [security]}
      - {name: recording_sources.source_key, purpose: Locate the verified immutable input, necessity: required, data_classes: [content]}
      - {name: recording_sources.source_etag, purpose: Pin all Range reads to verified bytes, necessity: required, data_classes: [security]}
      - {name: recording_sources.source_verified_at, purpose: Avoid rehashing a checkpointed input, necessity: required, data_classes: [activity]}
      - {name: recording_sources.package_id, purpose: Project the independently validated ready package, necessity: required, data_classes: [identity]}
      - {name: recording_sources.processing_error, purpose: Report redacted bounded failure classification, necessity: required, data_classes: [activity]}
      - {name: recording_sources.cleanup_after, purpose: Bound repeat reconciliation frequency, necessity: required, data_classes: [activity]}
    attribution: {mode: manual, explanation: The actor is the upstream authorized uploader and is not inferred to be a recorded participant.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-source-attempts
    owner: asset-api
    purpose: Keep server-owned encode and source copy scopes discoverable after crashes for safe byte cleanup.
    necessity: required
    storage: {kind: postgres, resource: recording_source_attempts, sources: [{path: internal/postgres/recording_source_job.go, symbol: RecordingSourceStore.ClaimSourceProcessing}]}
    subject_keys: []
    data_classes: [security, activity]
    fields:
      - {name: recording_source_attempts.claim_id, purpose: Identify isolated encode and source copy prefixes, necessity: required, data_classes: [security]}
      - {name: recording_source_attempts.source_id, purpose: Link the processing attempt to its input, necessity: required, data_classes: [activity]}
      - {name: recording_source_attempts.state, purpose: Distinguish active and abandoned output, necessity: required, data_classes: [activity]}
      - {name: recording_source_attempts.created_at, purpose: Order processing attempts, necessity: required, data_classes: [activity]}
      - {name: recording_source_attempts.finished_at, purpose: Anchor stale-worker cleanup grace, necessity: required, data_classes: [activity]}
    attribution: {mode: manual, explanation: The source carries uploader provenance; attempts do not identify recorded participants.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-packages
    owner: asset-api
    purpose: Bind immutable HLS inventory and durable upload completion to the authorized CMS actor without entering the ordinary Blob scan pipeline.
    necessity: required
    storage: {kind: postgres, resource: recording_packages, sources: [{path: internal/postgres/recording_package.go, symbol: RecordingPackageStore.Create}]}
    subject_keys: []
    data_classes: [identity, content, security, activity]
    fields:
      - {name: recording_packages.id, purpose: Server-owned package identifier and storage scope, necessity: required, data_classes: [identity]}
      - {name: recording_packages.session_id, purpose: Identify the single upload session for the package, necessity: required, data_classes: [identity]}
      - {name: recording_packages.owner_service, purpose: Enforce CMS ownership, necessity: required, data_classes: [security]}
      - {name: recording_packages.actor_id, purpose: Bind upload and idempotency to the CMS-authorized actor, necessity: required, data_classes: [identity, security]}
      - {name: recording_packages.recording_id, purpose: Link bytes to the CMS business record, necessity: required, data_classes: [identity]}
      - {name: recording_packages.idempotency_key, purpose: Replay the same upload without changing inventory or ownership, necessity: required, data_classes: [security]}
      - {name: recording_packages.state, purpose: Track upload and validation lifecycle, necessity: required, data_classes: [activity]}
      - {name: recording_packages.processing_progress, purpose: Expose capability-free fenced validation counters and timestamps under existing receipt retention, necessity: required, data_classes: [activity]}
      - {name: recording_packages.size_bytes, purpose: Enforce total package byte budget, necessity: required, data_classes: [content]}
      - {name: recording_packages.inventory, purpose: Preserve declared object hashes and rendition metadata for subsequent validation, necessity: required, data_classes: [content, security]}
      - {name: recording_packages.created_at, purpose: Record package creation time, necessity: required, data_classes: [activity]}
      - {name: recording_packages.expires_at, purpose: Bound upload capability issuance, necessity: required, data_classes: [activity]}
      - {name: recording_packages.completed_at, purpose: Persist durable freeze acceptance independent of the HTTP response, necessity: required, data_classes: [activity]}
      - {name: recording_packages.validation_attempts, purpose: Bound crash and transient validation retries, necessity: required, data_classes: [activity]}
      - {name: recording_packages.next_attempt_at, purpose: Apply retry backoff, necessity: required, data_classes: [activity]}
      - {name: recording_packages.claim_id, purpose: Fence stale worker commits, necessity: required, data_classes: [security]}
      - {name: recording_packages.claimed_until, purpose: Bound worker lease lifetime, necessity: required, data_classes: [security]}
      - {name: recording_packages.final_prefix, purpose: Identify immutable validated media bytes, necessity: required, data_classes: [content]}
      - {name: recording_packages.ready_at, purpose: Record first successful validation, necessity: required, data_classes: [activity]}
      - {name: recording_packages.media_expires_at, purpose: Project the authoritative media deadline, necessity: required, data_classes: [activity]}
      - {name: recording_packages.retention_revision, purpose: Identify the projected policy revision, necessity: required, data_classes: [activity]}
      - {name: recording_packages.grant_cleanup_after, purpose: Protect issued grants after retroactive policy shortening, necessity: required, data_classes: [security]}
      - {name: recording_packages.validation_error, purpose: Record bounded generic failure classification without provider secrets, necessity: required, data_classes: [activity]}
      - {name: recording_packages.cleanup_after, purpose: Bound repeated late-write reconciliation frequency, necessity: required, data_classes: [activity]}
      - {name: recording_packages.preview_state, purpose: Track optional preview generation without changing video readiness, necessity: required, data_classes: [activity]}
      - {name: recording_packages.preview_attempts, purpose: Bound preview retries including crashes, necessity: required, data_classes: [activity]}
      - {name: recording_packages.preview_claim_id, purpose: Fence preview publication, necessity: required, data_classes: [security]}
      - {name: recording_packages.preview_claimed_until, purpose: Reclaim lost preview workers, necessity: required, data_classes: [security]}
      - {name: recording_packages.preview_next_attempt_at, purpose: Apply preview retry backoff, necessity: required, data_classes: [activity]}
    attribution: {mode: manual, explanation: actor_id is the upstream authorized uploader; it is not inferred as a video participant or an Account user until actor provenance is resolved.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-processing-slots
    owner: asset-api
    purpose: Bound concurrent HLS processing across scheduled job executions and fence stale workers.
    necessity: required
    storage: {kind: postgres, resource: recording_processing_slots, sources: [{path: internal/postgres/recording_package.go, symbol: RecordingPackageStore.ClaimPackageValidation}]}
    subject_keys: []
    data_classes: [security, activity]
    fields:
      - {name: recording_processing_slots.slot, purpose: Represent one of two global processing slots, necessity: required, data_classes: [security]}
      - {name: recording_processing_slots.job_id, purpose: Bind the slot to an active job, necessity: required, data_classes: [activity]}
      - {name: recording_processing_slots.claim_id, purpose: Fence stale slot ownership, necessity: required, data_classes: [security]}
      - {name: recording_processing_slots.leased_until, purpose: Reclaim slots after worker loss, necessity: required, data_classes: [activity]}
    attribution: {mode: none, explanation: Slots identify server jobs rather than human subjects.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-package-attempts
    owner: asset-api
    purpose: Preserve immutable final attempt prefixes for crash-safe cleanup and validation recovery.
    necessity: required
    storage: {kind: postgres, resource: recording_package_attempts, sources: [{path: internal/postgres/recording_package.go, symbol: RecordingPackageStore.ClaimPackageValidation}]}
    subject_keys: []
    data_classes: [security, activity]
    fields:
      - {name: recording_package_attempts.claim_id, purpose: Identify server-owned immutable final prefix, necessity: required, data_classes: [security]}
      - {name: recording_package_attempts.package_id, purpose: Link processing attempt to authorized package, necessity: required, data_classes: [activity]}
      - {name: recording_package_attempts.state, purpose: Distinguish active and abandoned byte prefixes, necessity: required, data_classes: [activity]}
      - {name: recording_package_attempts.created_at, purpose: Schedule orphan cleanup, necessity: required, data_classes: [activity]}
      - {name: recording_package_attempts.finished_at, purpose: Record attempt completion or abandonment, necessity: required, data_classes: [activity]}
    attribution: {mode: manual, explanation: The package carries upstream actor provenance; attempts do not identify video participants.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.recording-preview-attempts
    owner: asset-api
    purpose: Preserve bounded preview attempt prefixes for expiry cleanup and ambiguous publication recovery.
    necessity: required
    storage: {kind: postgres, resource: recording_preview_attempts, sources: [{path: internal/postgres/recording_preview.go, symbol: RecordingPackageStore.ClaimPackagePreview}]}
    subject_keys: []
    data_classes: [security, activity]
    fields:
      - {name: recording_preview_attempts.claim_id, purpose: Identify immutable derived byte prefix, necessity: required, data_classes: [security]}
      - {name: recording_preview_attempts.package_id, purpose: Link preview attempt to authorized package and retention, necessity: required, data_classes: [activity]}
    attribution: {mode: manual, explanation: Package actor provenance does not identify video participants.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: pending_legal, rule: null, action: none}
    cleanup: {mode: none, implementation: [], evidence: []}
  - id: asset.account-artifact-content
    owner: asset-api
    purpose: Store Account avatar and DSR-export Blob bytes; physically delete them idempotently only after Store.ClaimPurge finds an eligible asset.
    necessity: required
    storage:
      kind: blob
      resource: Azure Blob Storage
      sources:
        - path: internal/storage/azure/store.go
          symbol: Store.Delete
        - path: internal/postgres/store.go
          symbol: Store.ClaimPurge
    subject_keys:
      - kind: user_id
        field: assets.owner_id
        evidence:
          - path: internal/assets/service.go
            symbol: Service.CreateUploadSession
    data_classes: [identity, content]
    fields:
      - {name: blob.bytes, purpose: Account avatar or DSR export bytes, necessity: required, data_classes: [content]}
